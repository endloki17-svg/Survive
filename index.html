<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survive: 자연재해 무인도</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        /* === 전역 및 폰트 설정 === */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #0f172a; color: #f8fafc; 
            font-family: 'Noto Sans KR', sans-serif; overflow: hidden; 
        }

        /* === 애니메이션 정의 === */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); } 50% { box-shadow: 0 0 30px rgba(56, 189, 248, 0.8); } 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); } }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }

        /* === 화면 관리 === */
        .screen {
            position: absolute; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            flex-direction: column; z-index: 10;
            opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        .screen.active { opacity: 1; pointer-events: auto; }

        /* === 글래스모피즘 UI 패널 === */
        .glass-panel {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 420px; width: 90%;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        h1, h2 { margin-top: 0; background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        h1 { font-size: 2.5rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; }
        p { color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }

        /* === 폼 엘리먼트 디자인 === */
        input, select {
            width: 100%; padding: 16px; margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.5); border: 1px solid #334155;
            color: #fff; border-radius: 12px; font-size: 1rem;
            transition: all 0.3s ease; outline: none; box-sizing: border-box;
        }
        input:focus, select:focus { border-color: #38bdf8; background: rgba(15, 23, 42, 0.8); }
        
        button {
            width: 100%; padding: 16px; margin-bottom: 10px;
            background: linear-gradient(135deg, #0ea5e9, #6366f1);
            color: white; border: none; border-radius: 12px;
            font-size: 1.1rem; font-weight: 700; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            animation: pulseGlow 3s infinite;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(14, 165, 233, 0.4); }
        button.secondary { background: rgba(51, 65, 85, 0.8); animation: none; }
        button.secondary:hover { background: rgba(71, 85, 105, 1); box-shadow: none; }

        /* === 캔버스 및 인게임 HUD (DOM 분리) === */
        #gameCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        #inGameHUD {
            position: absolute; top: 20px; left: 20px; z-index: 5;
            display: none; pointer-events: none;
            animation: fadeIn 1s ease;
        }
        .hp-bar-container {
            width: 300px; height: 24px; background: rgba(0,0,0,0.5);
            border-radius: 12px; border: 2px solid rgba(255,255,255,0.2);
            overflow: hidden; margin-top: 10px; position: relative;
        }
        #hpBar {
            height: 100%; background: linear-gradient(90deg, #ef4444, #f97316);
            width: 100%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #hpText { position: absolute; width: 100%; text-align: center; top: 2px; font-size: 14px; font-weight: bold; text-shadow: 1px 1px 2px black; }
        .time-box { background: rgba(15,23,42,0.7); padding: 10px 20px; border-radius: 12px; display: inline-block; font-size: 1.2rem; font-weight: bold; backdrop-filter: blur(5px); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 1. 인트로 -->
    <div id="introScreen" class="screen active">
        <div class="glass-panel" style="animation-name: float; animation-duration: 4s; animation-iteration-count: infinite;">
            <h1>SURVIVE</h1>
            <p>자연재해가 휩쓰는 무인도.<br>끝까지 살아남아 전설이 되십시오.</p>
            <button onclick="switchScreen('authScreen')">게임 진입</button>
        </div>
    </div>

    <!-- 2. 로그인 -->
    <div id="authScreen" class="screen">
        <div class="glass-panel">
            <h2>플레이어 등록</h2>
            <input type="text" id="username" placeholder="캐릭터 닉네임" autocomplete="off" required>
            <input type="password" id="password" placeholder="비밀번호" required>
            <button onclick="login()">로비 입장</button>
        </div>
    </div>

    <!-- 3. 메인 게임 및 로비 팝업 -->
    <canvas id="gameCanvas"></canvas>
    
    <div id="inGameHUD">
        <div class="time-box">생존 시간: <span id="timeDisplay">0</span>초</div>
        <div class="hp-bar-container">
            <div id="hpBar"></div>
            <div id="hpText">100 / 100</div>
        </div>
    </div>

    <div id="roomScreen" class="screen">
        <div class="glass-panel">
            <h2>방 설정 시스템</h2>
            <select id="userType" onchange="document.getElementById('studentOptions').classList.toggle('hidden', this.value !== 'student')">
                <option value="general">일반 모드</option>
                <option value="student">학생 교육 모드</option>
            </select>
            
            <div id="studentOptions" class="hidden">
                <select id="grade"><option>1학년</option><option>2학년</option><option>3학년</option><option>4학년</option><option>5학년</option><option>6학년</option></select>
                <select id="unit"><option>1단원</option><option>2단원</option><option>3단원</option></select>
            </div>
            
            <button onclick="createRoom()">호스트로 방 만들기</button>
            <div style="margin: 20px 0; color: #64748b; display: flex; align-items: center;"><hr style="flex:1; border-color:#334155; margin-right:10px;">또는<hr style="flex:1; border-color:#334155; margin-left:10px;"></div>
            <input type="text" id="joinCode" placeholder="입장 코드 (3자리 영문/숫자)" maxlength="3" style="text-transform: uppercase;">
            <button onclick="joinRoom()" style="background: linear-gradient(135deg, #10b981, #059669);">코드 입력 후 참가</button>
            <button class="secondary" onclick="closeRoomUI()">돌아가기</button>
        </div>
    </div>

<script>
    /* === 1. 리소스 매니저 (영상에 나온 실제 파일명 매핑) === */
    const IMAGES = {
        lobby: new Image(),
        city: new Image(),
        disasters: new Image(),
        characters: new Image()
    };
    // 영상 파일 목록에 표시된 이름 정확히 반영
    IMAGES.lobby.src = '1790245071083.png';
    IMAGES.city.src = '1790245410543.png';
    IMAGES.disasters.src = '1790245888729.png';
    IMAGES.characters.src = '1790248184465.png';

    /* === 2. 코어 엔진 변수 === */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let gameState = 'intro'; // intro, auth, lobby, playing, gameover
    
    // 부드러운 카메라 추적을 위한 Lerp 변수
    const camera = { x: 0, y: 0, targetX: 0, targetY: 0, zoom: 2.5 };
    
    const player = {
        x: 400, y: 500, width: 48, height: 72, speed: 6,
        hp: 100, maxHp: 100, state: 'alive', reviveClicks: 0,
        frameX: 0, frameY: 0, moving: false, // 스프라이트 애니메이션 용
        name: ''
    };
    
    const keys = { w:false, a:false, s:false, d:false, ArrowUp:false, ArrowDown:false, ArrowLeft:false, ArrowRight:false };
    
    let peer = null;
    let connections = [];
    let roomCode = '';
    let isHost = false;
    let otherPlayers = {};
    let disasters = [];
    let gameTime = 0;
    let frameCount = 0;
    let lastTime = performance.now();

    function resize() {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize); resize();

    /* === 3. UI 컨트롤러 === */
    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        if(screenId) document.getElementById(screenId).classList.add('active');
        gameState = screenId === 'authScreen' ? 'auth' : screenId === 'roomScreen' ? 'room' : gameState;
    }

    function login() {
        const name = document.getElementById('username').value.trim();
        if(!name) return alert('멋진 닉네임을 입력해주세요.');
        player.name = name;
        switchScreen(null); // 모든 UI 끄기
        gameState = 'lobby';
        requestAnimationFrame(gameLoop);
    }

    function closeRoomUI() {
        switchScreen(null);
        gameState = 'lobby';
        player.y += 80; // 재트리거 방지를 위해 캐릭터를 아래로 밀어냄
    }

    /* === 4. PeerJS 네트워킹 레이어 === */
    function generateCode() {
        return Math.random().toString(36).substring(2, 5).toUpperCase();
    }

    function initPeer(id, callback) {
        peer = new Peer("survival_v1_" + id);
        peer.on('open', callback);
        peer.on('connection', setupConnection);
        peer.on('error', err => alert('서버 통신 오류: ' + err.type));
    }

    function setupConnection(conn) {
        if(!connections.includes(conn)) connections.push(conn);
        conn.on('data', data => {
            if(data.type === 'update') otherPlayers[conn.peer] = data.p;
            else if(data.type === 'start') startGame();
            else if(data.type === 'revive' && player.state === 'ghost') processRevive();
        });
    }

    function createRoom() {
        roomCode = generateCode();
        isHost = true;
        initPeer(roomCode, () => {
            alert(`[ 호스트 방 생성 완료 ]\n친구들에게 다음 코드를 알려주세요: ${roomCode}`);
            switchScreen(null);
            startGame();
        });
    }

    function joinRoom() {
        roomCode = document.getElementById('joinCode').value.toUpperCase();
        if(roomCode.length !== 3) return;
        isHost = false;
        initPeer("p_" + generateCode(), () => {
            const conn = peer.connect("survival_v1_" + roomCode);
            conn.on('open', () => {
                setupConnection(conn);
                alert('방 접속 성공! 게임이 시작되기를 기다립니다.');
                switchScreen(null);
            });
        });
    }

    /* === 5. 코어 게임 루프 및 렌더링 === */
    window.addEventListener('keydown', e => keys[e.key] = true);
    window.addEventListener('keyup', e => keys[e.key] = false);
    
    // 부활 터치 이벤트
    canvas.addEventListener('pointerdown', e => {
        if(gameState !== 'playing') return;
        const wx = (e.clientX - width/2) / camera.zoom + camera.x;
        const wy = (e.clientY - height/2) / camera.zoom + camera.y;
        
        Object.keys(otherPlayers).forEach(id => {
            let op = otherPlayers[id];
            if(op.state === 'ghost' && Math.hypot(op.x - wx, op.y - wy) < 60) {
                let conn = connections.find(c => c.peer === id);
                if(conn && conn.open) conn.send({type: 'revive'});
            }
        });
    });

    function processRevive() {
        player.reviveClicks++;
        if(player.reviveClicks >= 5) {
            player.state = 'alive';
            player.hp = 50;
            player.reviveClicks = 0;
            updateHUD();
        }
    }

    function startGame() {
        gameState = 'playing';
        document.getElementById('inGameHUD').style.display = 'block';
        player.x = 1000; player.y = 1000; // 맵 중앙부 예상 좌표
        if(isHost) {
            connections.forEach(c => c.send({type: 'start'}));
            setInterval(() => { gameTime++; document.getElementById('timeDisplay').innerText = gameTime; }, 1000);
            setInterval(spawnDisaster, 1500);
        }
    }

    function updateHUD() {
        const bar = document.getElementById('hpBar');
        const txt = document.getElementById('hpText');
        const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
        bar.style.width = hpPercent + '%';
        if(player.state === 'ghost') {
            bar.style.background = 'transparent';
            txt.innerText = `유령 상태 (터치 대기중: ${player.reviveClicks}/5)`;
            txt.style.color = '#38bdf8';
        } else {
            bar.style.background = `linear-gradient(90deg, ${hpPercent < 30 ? '#ef4444, #991b1b' : '#10b981, #059669'})`;
            txt.innerText = `${Math.floor(player.hp)} / ${player.maxHp}`;
            txt.style.color = '#fff';
        }
    }

    function spawnDisaster() {
        const scale = 1 + (gameTime * 0.02);
        disasters.push({
            x: player.x + (Math.random() - 0.5) * 800,
            y: player.y - 600,
            vx: (Math.random() - 0.5) * 3,
            vy: (Math.random() * 3 + 3) * scale,
            size: 80 * scale,
            type: Math.floor(Math.random() * 4),
            rotation: 0
        });
    }

    function updatePhysics(dt) {
        // 플레이어 이동 로직
        const spd = player.state === 'ghost' ? player.speed * 0.4 : player.speed;
        let moved = false;
        if(keys.w || keys.ArrowUp) { player.y -= spd; moved = true; player.frameY = 3; }
        if(keys.s || keys.ArrowDown) { player.y += spd; moved = true; player.frameY = 0; }
        if(keys.a || keys.ArrowLeft) { player.x -= spd; moved = true; player.frameY = 1; }
        if(keys.d || keys.ArrowRight) { player.x += spd; moved = true; player.frameY = 2; }
        
        player.moving = moved;

        // 로비 트리거 존
        if (gameState === 'lobby' && player.y < 300 && player.x > width*0.4 && player.x < width*0.6) {
            switchScreen('roomScreen');
        }

        if(gameState === 'playing') {
            // 카메라 스무딩 (Lerp)
            camera.targetX = player.x;
            camera.targetY = player.y;
            camera.x += (camera.targetX - camera.x) * 0.1;
            camera.y += (camera.targetY - camera.y) * 0.1;

            if(isHost) {
                for(let i = disasters.length - 1; i >= 0; i--) {
                    let d = disasters[i];
                    d.x += d.vx; d.y += d.vy; d.rotation += 5;
                    
                    if(player.state === 'alive' && Math.hypot(player.x - d.x, player.y - d.y) < d.size * 0.4) {
                        player.hp -= 15;
                        disasters.splice(i, 1);
                        if(player.hp <= 0) { player.hp = 0; player.state = 'ghost'; }
                        updateHUD();
                        continue;
                    }
                    if(d.y > camera.y + height) disasters.splice(i, 1);
                }
            }
        }
        
        // 초당 10번만 브로드캐스트 (네트워크 최적화)
        if(frameCount % 6 === 0 && peer) {
            connections.forEach(c => {
                if(c.open) c.send({type: 'update', p: { x: player.x, y: player.y, s: player.state, fX: player.frameX, fY: player.frameY, n: player.name }});
            });
        }
    }

    function render() {
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, width, height);

        if(gameState === 'lobby' && IMAGES.lobby.complete) {
            // 로비 배경을 꽉 차게 그림
            ctx.drawImage(IMAGES.lobby, 0, 0, width, height);
            drawSprite(player.x, player.y, player, true);
            
        } else if(gameState === 'playing' || gameState === 'gameover') {
            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);

            // 맵 렌더링
            if(IMAGES.city.complete) ctx.drawImage(IMAGES.city, 0, 0);

            // 타 플레이어 렌더링
            Object.values(otherPlayers).forEach(p => drawSprite(p.x, p.y, p, false));
            // 나 렌더링
            drawSprite(player.x, player.y, player, true);

            // 재해 렌더링
            if(IMAGES.disasters.complete) {
                disasters.forEach(d => {
                    ctx.save();
                    ctx.translate(d.x, d.y);
                    // 토네이도 등은 회전 효과 부여
                    if(d.type === 1 || d.type === 3) ctx.rotate(d.rotation * Math.PI / 180);
                    // 1790245888729.png 이미지 구조에 맞춰 자르기 (임시 좌표 128x128)
                    let srcX = (d.type % 2) * 128;
                    let srcY = Math.floor(d.type / 2) * 128;
                    ctx.drawImage(IMAGES.disasters, srcX, srcY, 128, 128, -d.size/2, -d.size/2, d.size, d.size);
                    ctx.restore();
                });
            }
            ctx.restore();
        }
    }

    // 캐릭터 스프라이트 시트 렌더러
    function drawSprite(x, y, pData, isMe) {
        ctx.save();
        if(pData.s === 'ghost' || pData.state === 'ghost') {
            ctx.globalAlpha = 0.5;
            ctx.filter = 'grayscale(100%) blur(1px)'; // 유령 시각 효과
        }

        // 애니메이션 프레임 계산 (이동 중일 때만 발 움직임)
        if(isMe && player.moving && frameCount % 10 === 0) {
            player.frameX = (player.frameX + 1) % 4; // 4프레임 걷기 애니메이션 가정
        } else if(isMe && !player.moving) {
            player.frameX = 0;
        }

        if(IMAGES.characters.complete) {
            // 1790248184465.png 의 단일 캐릭터 크기 추정 (가로 64, 세로 64 기준 분할)
            const spriteW = 64, spriteH = 64;
            const fX = (pData.fX !== undefined ? pData.fX : player.frameX) * spriteW;
            const fY = (pData.fY !== undefined ? pData.fY : player.frameY) * spriteH;
            ctx.drawImage(IMAGES.characters, fX, fY, spriteW, spriteH, x - player.width/2, y - player.height, player.width, player.height);
        } else {
            ctx.fillStyle = isMe ? '#38bdf8' : '#f43f5e';
            ctx.beginPath(); ctx.roundRect(x - player.width/2, y - player.height, player.width, player.height, 10); ctx.fill();
        }

        // 이름 및 상태 태그
        ctx.globalAlpha = 1; ctx.filter = 'none';
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.beginPath(); ctx.roundRect(x - 40, y - player.height - 25, 80, 20, 5); ctx.fill();
        ctx.fillStyle = isMe ? '#bef264' : '#fff';
        ctx.font = '12px Noto Sans KR'; ctx.textAlign = 'center';
        const nameStr = pData.n || pData.name || 'Player';
        ctx.fillText(nameStr, x, y - player.height - 11);
        ctx.restore();
    }

    function gameLoop(timestamp) {
        if(gameState === 'intro' || gameState === 'auth') return;
        
        const dt = timestamp - lastTime;
        lastTime = timestamp;
        frameCount++;

        updatePhysics(dt);
        render();

        requestAnimationFrame(gameLoop);
    }
</script>
</body>
</html>
