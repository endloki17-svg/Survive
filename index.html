<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE: PIXEL ISLAND</title>
    <!-- PeerJS 로드 -->
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <!-- 완벽한 한국어 픽셀 폰트 (갈무리) -->
    <link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
    <style>
        /* === 글로벌 레트로 픽셀 설정 === */
        * { box-sizing: border-box; image-rendering: pixelated; }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #181425; color: #fff; 
            font-family: 'Galmuri11', sans-serif; 
            overflow: hidden; touch-action: none; 
        }

        /* CRT 모니터 스캔라인 효과 */
        body::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 999; background-size: 100% 4px, 6px 100%; pointer-events: none;
        }

        /* === 뷰 전환 시스템 === */
        .view { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; }
        .view.active { display: flex; }

        /* === 픽셀 아트 UI 컴포넌트 === */
        .pixel-panel {
            background: #262b44;
            border: 4px solid #fff;
            box-shadow: inset -4px -4px 0px 0px #181425, 4px 4px 0px 0px #000;
            padding: 30px; width: 90%; max-width: 400px; text-align: center;
        }
        
        .pixel-title {
            color: #ffcd75; font-size: 32px; text-shadow: 2px 2px 0px #e43b44, 4px 4px 0px #181425;
            margin: 0 0 20px 0; line-height: 1.2; letter-spacing: 2px;
        }

        .pixel-input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            background: #181425; color: #fff; border: 4px solid #5a6988;
            font-family: 'Galmuri11', sans-serif; font-size: 16px; outline: none;
        }
        .pixel-input:focus { border-color: #ffcd75; }

        .pixel-btn {
            width: 100%; padding: 15px; margin-bottom: 10px;
            background: #e43b44; color: #fff; border: 4px solid #fff;
            font-family: 'Galmuri11', sans-serif; font-size: 18px; cursor: pointer;
            box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.4), 4px 4px 0px 0px #181425;
            text-shadow: 2px 2px 0px #181425; transition: 0.1s;
        }
        .pixel-btn:active {
            box-shadow: inset 4px 4px 0px 0px rgba(0,0,0,0.4), 0 0 0 0 #181425;
            transform: translate(4px, 4px);
        }
        .pixel-btn.blue { background: #0099db; }
        .pixel-btn.green { background: #3e8948; }

        /* === 랜딩 페이지 === */
        #landingView { background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAACCAYAAABytg0kAAAAFElEQVQIW2NkYGD4z8DAwMgAI0AMCKcCBEdy2rQAAAAASUVORK5CYII=') repeat; background-size: 64px 64px; }
        .blink-text { color: #fff; font-size: 20px; animation: blink 1s infinite; cursor: pointer; margin-top: 40px; }
        @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

        /* === 탭 및 캐릭터 선택 === */
        .tabs { display: flex; margin-bottom: 20px; gap: 10px; }
        .tab { flex: 1; padding: 10px; background: #5a6988; cursor: pointer; border: 2px solid #fff; text-align: center; }
        .tab.active { background: #e43b44; font-weight: bold; }

        .char-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .char-box { background: #181425; border: 2px solid #5a6988; padding: 10px 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .char-box.selected { border-color: #ffcd75; background: #3a4466; }
        .char-preview { width: 48px; height: 48px; }

        /* === 인게임 UI === */
        #gameCanvas { position: absolute; top: 0; left: 0; z-index: 1; }
        
        #hud { position: absolute; top: 20px; left: 20px; z-index: 5; pointer-events: none; display: none; }
        .hp-frame { border: 4px solid #fff; background: #181425; width: 250px; height: 30px; position: relative; box-shadow: 4px 4px 0px #000; }
        #hpBar { height: 100%; background: #3e8948; width: 100%; transition: 0.2s; }
        .hud-text { position: absolute; top: 2px; width: 100%; text-align: center; font-size: 16px; text-shadow: 2px 2px 0px #000; }
        .time-box { background: #262b44; border: 4px solid #fff; padding: 10px; display: inline-block; margin-bottom: 10px; box-shadow: 4px 4px 0px #000; }

        /* 모바일 조이스틱 */
        #joyZone { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; z-index: 10; display: none; }
        #joyBase { width: 100%; height: 100%; background: rgba(24, 20, 37, 0.5); border: 4px solid rgba(255,255,255,0.5); border-radius: 50%; position: relative; }
        #joyStick { width: 60px; height: 60px; background: #e43b44; border: 4px solid #fff; border-radius: 50%; position: absolute; top: 36px; left: 36px; pointer-events: none; }
    </style>
</head>
<body>

    <!-- 1. 타이틀 화면 -->
    <div id="landingView" class="view active" onclick="navTo('authView')">
        <h1 class="pixel-title" style="font-size: 48px;">SURVIVE<br><span style="font-size: 24px; color:#fff; text-shadow: 2px 2px #000;">자연재해 무인도</span></h1>
        <div class="blink-text">화면을 터치하여 시작하세요</div>
    </div>

    <!-- 2. 로그인/가입 -->
    <div id="authView" class="view">
        <div class="pixel-panel">
            <h2 class="pixel-title" style="font-size: 24px;">접속 시스템</h2>
            <div class="tabs">
                <div class="tab active" id="tabL" onclick="setTab('L')">로그인</div>
                <div class="tab" id="tabS" onclick="setTab('S')">가입</div>
            </div>
            
            <div id="formL">
                <input type="text" id="l_id" class="pixel-input" placeholder="아이디">
                <input type="password" class="pixel-input" placeholder="비밀번호">
                <button class="pixel-btn" onclick="login()">게임 접속</button>
            </div>
            
            <div id="formS" style="display:none;">
                <input type="text" id="s_id" class="pixel-input" placeholder="사용할 아이디">
                <input type="password" class="pixel-input" placeholder="비밀번호">
                <button class="pixel-btn blue" onclick="alert('가입되었습니다.'); setTab('L');">계정 생성</button>
            </div>
        </div>
    </div>

    <!-- 3. 로비 화면 -->
    <div id="lobbyView" class="view">
        <div class="pixel-panel" style="max-width: 500px;">
            <h2 class="pixel-title" style="font-size: 24px;">대기실</h2>
            
            <p style="text-align: left; margin: 0 0 10px 0; color: #8b9bb4;">캐릭터 선택</p>
            <div class="char-grid">
                <!-- 캔버스로 캐릭터 프리뷰 동적 생성 -->
                <div class="char-box selected" onclick="selectChar(0)"><canvas id="cp0" class="char-preview" width="16" height="16"></canvas></div>
                <div class="char-box" onclick="selectChar(1)"><canvas id="cp1" class="char-preview" width="16" height="16"></canvas></div>
                <div class="char-box" onclick="selectChar(2)"><canvas id="cp2" class="char-preview" width="16" height="16"></canvas></div>
                <div class="char-box" onclick="selectChar(3)"><canvas id="cp3" class="char-preview" width="16" height="16"></canvas></div>
            </div>

            <div style="display:flex; gap:10px; margin-bottom: 20px;">
                <button class="pixel-btn" style="background:#5a6988; font-size:14px;" onclick="alert('상점은 개발중입니다.')">상점</button>
                <button class="pixel-btn" style="background:#5a6988; font-size:14px;" onclick="alert('설정 기능 준비중')">설정</button>
            </div>

            <select class="pixel-input" style="padding: 10px;" id="modeSel">
                <option value="normal">일반 생존 모드</option>
                <option value="edu">학생 교육 모드 (문제 출제)</option>
            </select>

            <button class="pixel-btn green" onclick="createRoom()">호스트 방 만들기</button>
            
            <div style="display:flex; gap:10px; margin-top:10px;">
                <input type="text" id="joinCode" class="pixel-input" style="margin:0; text-transform: uppercase;" placeholder="코드(3자리)" maxlength="3">
                <button class="pixel-btn blue" style="margin:0; width:100px;" onclick="joinRoom()">참가</button>
            </div>
        </div>
    </div>

    <!-- 4. 인게임 화면 -->
    <canvas id="gameCanvas"></canvas>
    <div id="joyZone"><div id="joyBase"><div id="joyStick"></div></div></div>
    
    <div id="hud">
        <div class="time-box">생존: <span id="timeDisplay" style="color:#ffcd75;">0</span>초 (코드: <span id="hudCode"></span>)</div>
        <div class="hp-frame">
            <div id="hpBar"></div>
            <div class="hud-text" id="hpText">100 / 100</div>
        </div>
    </div>

<script>
    /* =========================================================================
       [ 1. 완벽한 도트 픽셀 아트 엔진 ]
       ========================================================================= */
    const Pal = {
        '0': null,       '1': '#181425', // 테두리 검정
        '2': '#ffcd75',  '3': '#e43b44', // 피부, 빨강
        '4': '#0099db',  '5': '#3e8948', // 파랑, 초록
        '6': '#b55088',  '7': '#ffffff', // 보라, 흰색
        '8': '#8b9bb4',  '9': '#5a6988', // 밝은회색, 짙은회색
        'a': '#8f563b',  'b': '#2ce8f5', // 갈색, 물색
        'c': '#f9a31b',  'd': '#fbb954', // 주황, 모래색
        'e': '#265c42',  'f': '#fee761'  // 짙은초록, 노랑
    };

    // 캐릭터 스프라이트 (16x16) - RPG 주인공 스타일
    const CharData = [
        [ // Red Hero
            "0000011111100000","0000133333310000","0001333333331000","0001122222211000",
            "0012212222122100","0012222222222100","0012122222212100","0001111111111000",
            "0000133333310000","0001333333331000","0001713333171000","0001713333171000",
            "0000111111110000","0000199119910000","0001999119991000","0001111001111000"
        ],
        [ // Blue Hero (색상만 4로 변경)
            "0000011111100000","0000144444410000","0001444444441000","0001122222211000",
            "0012212222122100","0012222222222100","0012122222212100","0001111111111000",
            "0000144444410000","0001444444441000","0001714444171000","0001714444171000",
            "0000111111110000","0000199119910000","0001999119991000","0001111001111000"
        ],
        [ // Green Hero
            "0000011111100000","0000155555510000","0001555555551000","0001122222211000",
            "0012212222122100","0012222222222100","0012122222212100","0001111111111000",
            "0000155555510000","0001555555551000","0001715555171000","0001715555171000",
            "0000111111110000","0000199119910000","0001999119991000","0001111001111000"
        ],
        [ // Purple Hero
            "0000011111100000","0000166666610000","0001666666661000","0001122222211000",
            "0012212222122100","0012222222222100","0012122222212100","0001111111111000",
            "0000166666610000","0001666666661000","0001716666171000","0001716666171000",
            "0000111111110000","0000199119910000","0001999119991000","0001111001111000"
        ]
    ];

    // 자연재해 스프라이트
    const DisasterData = {
        meteor: [
            "0000000110000000","0000001c31000000","000001cc33100000","000111cc33110000",
            "001c311cc1331000","01cc331113333100","01ccc33333333100","1ccccccc33333310",
            "1cccccccc3333310","01ccccccc3333100","011cccccc3331100","000111ccc3110000",
            "0000001111000000","0000000000000000","0000000000000000","0000000000000000"
        ],
        tornado: [
            "0001111111111100","0017777777777710","0178888888888871","0017777777777710",
            "0001111111111100","0000177777777100","0001788888888710","0000111111111100",
            "0000017777771000","0000178888887100","0000011111111000","0000001777710000",
            "0000001788710000","0000000111100000","0000000000000000","0000000000000000"
        ]
    };

    // 타일 스프라이트
    const TileData = {
        water: ["bbbbbbbbbbbbbbbb","bbbbbbbbbbbbbbbb","bb44bbbbbbbbbbbb","bbbbbbbbbbbb44bb"],
        sand:  ["dddddddddddddddd","dddddddddddddddd","ddcddddddddddddd","dddddddddddcdddd"],
        grass: ["5555555555555555","55e5555555555555","5555555555e55555","5555555555555555"],
        tree:  [
            "0000011111100000","0000155555510000","0001555e55551000","001555eee5555100",
            "00155eeeee555100","01555eeeee555510","0155eeeeeee55510","01555eeeee555510",
            "0011155e55111100","000001aa10000000","000001aa10000000","000001aa10000000",
            "000001aa10000000","000011aa11000000","00001aaaa1000000","0000111111000000"
        ]
    };

    const Sprites = { chars: [], meteor: null, tornado: null, mapCanvas: null };

    // 문자열 배열을 캔버스(이미지)로 변환
    function buildSprite(dataArr, width=16, height=16) {
        const c = document.createElement('canvas');
        c.width = width; c.height = height;
        const cx = c.getContext('2d');
        for(let y=0; y<dataArr.length; y++){
            for(let x=0; x<width; x++){
                let p = dataArr[y%dataArr.length][x];
                if(Pal[p]) { cx.fillStyle = Pal[p]; cx.fillRect(x,y,1,1); }
            }
        }
        return c;
    }

    // 절차적 지형 생성 (도트 맵)
    function generatePixelMap() {
        const TILE = 32; // 렌더링될 타일 크기
        const GRID = 80; // 80x80 그리드 (2560x2560 픽셀 맵)
        const mapC = document.createElement('canvas');
        mapC.width = GRID * TILE; mapC.height = GRID * TILE;
        const cx = mapC.getContext('2d');
        cx.imageSmoothingEnabled = false; // 도트 뭉개짐 방지

        const tWater = buildSprite(TileData.water);
        const tSand = buildSprite(TileData.sand);
        const tGrass = buildSprite(TileData.grass);
        const tTree = buildSprite(TileData.tree);

        // 섬 생성 알고리즘 (중앙에서 멀어질수록 확률 감소)
        let mapData = Array(GRID).fill().map(()=>Array(GRID).fill('water'));
        
        // 1. 유기적인 원형 섬 생성
        for(let i=0; i<40; i++) {
            let cx = GRID/2 + (Math.random()-0.5)*30;
            let cy = GRID/2 + (Math.random()-0.5)*30;
            let radius = 8 + Math.random()*15;
            for(let y=0; y<GRID; y++){
                for(let x=0; x<GRID; x++){
                    if(Math.hypot(x-cx, y-cy) < radius) mapData[y][x] = 'land';
                }
            }
        }

        // 2. 외곽 모래사장, 내부 잔디 변환 및 렌더링
        for(let y=0; y<GRID; y++){
            for(let x=0; x<GRID; x++){
                if(mapData[y][x] === 'water') {
                    cx.drawImage(tWater, x*TILE, y*TILE, TILE, TILE);
                } else {
                    // 모래인지 잔디인지 판별 (주변에 물이 있으면 모래)
                    let isEdge = false;
                    for(let dy=-2; dy<=2; dy++){
                        for(let dx=-2; dx<=2; dx++){
                            if(y+dy>=0 && y+dy<GRID && x+dx>=0 && x+dx<GRID) {
                                if(mapData[y+dy][x+dx] === 'water') isEdge = true;
                            }
                        }
                    }
                    if(isEdge) {
                        cx.drawImage(tSand, x*TILE, y*TILE, TILE, TILE);
                    } else {
                        cx.drawImage(tGrass, x*TILE, y*TILE, TILE, TILE);
                        // 무작위 나무 배치
                        if(Math.random() < 0.1) cx.drawImage(tTree, x*TILE, y*TILE - 10, TILE, TILE*1.2);
                    }
                }
            }
        }
        Sprites.mapCanvas = mapC;
    }

    function initAssets() {
        for(let i=0; i<4; i++) {
            Sprites.chars[i] = buildSprite(CharData[i]);
            // 로비 프리뷰 업데이트
            const pcx = document.getElementById('cp'+i).getContext('2d');
            pcx.imageSmoothingEnabled = false;
            pcx.drawImage(Sprites.chars[i], 0, 0, 16, 16);
        }
        Sprites.meteor = buildSprite(DisasterData.meteor);
        Sprites.tornado = buildSprite(DisasterData.tornado);
        generatePixelMap();
    }

    /* =========================================================================
       [ 2. UI 및 로직 ]
       ========================================================================= */
    let gameState = 'landing', myId = 'Player';
    const player = { x: 1280, y: 1280, width: 48, height: 48, speed: 6, hp: 100, maxHp: 100, state: 'alive', char: 0, revive: 0 };
    const camera = { x: 1280, y: 1280, targetX: 1280, targetY: 1280, zoom: 1.5 };
    
    let peer = null, connections = [], roomCode = '', isHost = false, otherPlayers = {};
    let disasters = [], gameTime = 0, keys = {x:0, y:0};

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    
    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
        ctx.imageSmoothingEnabled = false; // 도트 픽셀 유지 핵심
    }
    window.addEventListener('resize', resize); resize();

    function navTo(id) {
        document.querySelectorAll('.view').forEach(e => e.classList.remove('active'));
        if(id) document.getElementById(id).classList.add('active');
        gameState = id ? id.replace('View', '') : 'game';
    }

    function setTab(t) {
        document.getElementById('tabL').className = 'tab' + (t==='L'?' active':'');
        document.getElementById('tabS').className = 'tab' + (t==='S'?' active':'');
        document.getElementById('formL').style.display = t==='L'?'block':'none';
        document.getElementById('formS').style.display = t==='S'?'block':'none';
    }

    function login() {
        const id = document.getElementById('l_id').value.trim();
        if(!id) return alert('아이디를 입력하세요.');
        myId = id; navTo('lobbyView');
    }

    function selectChar(idx) {
        player.char = idx;
        document.querySelectorAll('.char-box').forEach((e, i) => e.className = 'char-box' + (i===idx?' selected':''));
    }

    /* =========================================================================
       [ 3. 멀티플레이 네트워킹 (PeerJS) ]
       ========================================================================= */
    function initNet(id, cb) {
        peer = new Peer("pxl_srv_" + id);
        peer.on('open', cb);
        peer.on('connection', c => {
            if(!connections.includes(c)) connections.push(c);
            c.on('data', d => {
                if(d.type === 'u') otherPlayers[c.peer] = d.p;
                else if(d.type === 'start') startGame();
                else if(d.type === 'revive' && player.state === 'ghost') {
                    player.revive++;
                    if(player.revive >= 5) { player.state = 'alive'; player.hp = 50; player.revive = 0; }
                }
            });
        });
    }

    function createRoom() {
        roomCode = Math.random().toString(36).substring(2,5).toUpperCase();
        isHost = true;
        initNet(roomCode, () => { alert('호스트 생성 완료! 코드: '+roomCode); startGame(); });
    }
    
    function joinRoom() {
        roomCode = document.getElementById('joinCode').value.toUpperCase();
        if(roomCode.length !== 3) return;
        initNet("usr_"+Math.random().toString(36).substring(2,6), () => {
            const c = peer.connect("pxl_srv_" + roomCode);
            c.on('open', () => { alert('입장 완료. 대기중...'); startGame(); });
        });
    }

    function startGame() {
        navTo(null);
        document.getElementById('hud').style.display = 'block';
        document.getElementById('joyZone').style.display = 'block';
        document.getElementById('hudCode').innerText = roomCode;
        player.x = 1280; player.y = 1280; // 맵 중앙
        if(isHost) {
            connections.forEach(c => c.send({type: 'start'}));
            setInterval(() => { gameTime++; document.getElementById('timeDisplay').innerText = gameTime; }, 1000);
            setInterval(() => {
                let s = 1 + (gameTime*0.03);
                disasters.push({ x: player.x+(Math.random()-0.5)*1000, y: player.y-600, vy: (Math.random()*4+4)*s, size: 60*s, t: Math.floor(Math.random()*2) });
            }, 1000);
        }
        requestAnimationFrame(loop);
    }

    /* =========================================================================
       [ 4. 입력 및 게임 루프 ]
       ========================================================================= */
    const joyZone = document.getElementById('joyZone'), joyStick = document.getElementById('joyStick'), joyBase = document.getElementById('joyBase');
    let jAct = false, jOri = {x:0, y:0}, maxJ = 40;
    
    joyZone.addEventListener('touchstart', e => { jAct=true; let r=joyBase.getBoundingClientRect(); jOri={x:r.left+r.width/2, y:r.top+r.height/2}; updateJ(e.touches[0]); });
    joyZone.addEventListener('touchmove', e => { if(jAct){ e.preventDefault(); updateJ(e.touches[0]); } });
    joyZone.addEventListener('touchend', () => { jAct=false; joyStick.style.transform=`translate(0,0)`; keys.x=0; keys.y=0; });
    
    function updateJ(t) {
        let dx = t.clientX - jOri.x, dy = t.clientY - jOri.y, d = Math.hypot(dx,dy);
        if(d > maxJ) { dx = (dx/d)*maxJ; dy = (dy/d)*maxJ; }
        joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
        keys.x = dx/maxJ; keys.y = dy/maxJ;
    }

    window.addEventListener('keydown', e => { if(['w','ArrowUp'].includes(e.key))keys.y=-1; if(['s','ArrowDown'].includes(e.key))keys.y=1; if(['a','ArrowLeft'].includes(e.key))keys.x=-1; if(['d','ArrowRight'].includes(e.key))keys.x=1; });
    window.addEventListener('keyup', e => { if(['w','s','ArrowUp','ArrowDown'].includes(e.key))keys.y=0; if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))keys.x=0; });

    // 부활 터치 이벤트
    canvas.addEventListener('pointerdown', e => {
        if(gameState !== 'game') return;
        const wx = (e.clientX - W/2) / camera.zoom + camera.x;
        const wy = (e.clientY - H/2) / camera.zoom + camera.y;
        Object.keys(otherPlayers).forEach(id => {
            let op = otherPlayers[id];
            if(op.s === 'ghost' && Math.hypot(op.x - wx, op.y - wy) < 80) {
                let conn = connections.find(c => c.peer === id);
                if(conn && conn.open) conn.send({type: 'revive'});
            }
        });
    });

    function loop(time) {
        if(gameState !== 'game') return;
        
        // 물리 및 이동
        const spd = player.state === 'ghost' ? player.speed * 0.4 : player.speed;
        player.x += keys.x * spd; player.y += keys.y * spd;

        // 카메라 러프(Lerp) 추적
        camera.targetX = player.x; camera.targetY = player.y;
        camera.x += (camera.targetX - camera.x) * 0.1;
        camera.y += (camera.targetY - camera.y) * 0.1;

        // 재해 처리 (호스트만)
        if(isHost) {
            for(let i=disasters.length-1; i>=0; i--){
                let d = disasters[i]; d.y += d.vy;
                if(player.state === 'alive' && Math.hypot(player.x - d.x, player.y - d.y) < d.size*0.4) {
                    player.hp -= 15; disasters.splice(i, 1);
                    if(player.hp <= 0) { player.hp=0; player.state='ghost'; }
                    continue;
                }
                if(d.y > camera.y + H/camera.zoom) disasters.splice(i,1);
            }
        }

        // HUD 및 네트워크 동기화
        const hpBar = document.getElementById('hpBar'), hpTxt = document.getElementById('hpText');
        hpBar.style.width = Math.max(0, (player.hp/player.maxHp)*100) + '%';
        if(player.state === 'ghost') {
            hpBar.style.background = 'transparent'; hpTxt.innerText = `유령 (터치대기 ${player.revive}/5)`; hpTxt.style.color = '#2ce8f5';
        } else {
            hpBar.style.background = player.hp < 30 ? '#e43b44' : '#3e8948'; hpTxt.innerText = `${Math.floor(player.hp)} / ${player.maxHp}`; hpTxt.style.color = '#fff';
        }

        if(Math.floor(time)%4===0 && peer) {
            connections.forEach(c => { if(c.open) c.send({type:'u', p:{x:player.x, y:player.y, s:player.state, c:player.char, n:myId}}); });
        }

        /* --- 렌더링 파트 --- */
        ctx.fillStyle = '#0284c7'; ctx.fillRect(0, 0, W, H);
        
        ctx.save();
        ctx.translate(W/2, H/2); ctx.scale(camera.zoom, camera.zoom); ctx.translate(-camera.x, -camera.y);

        // 1. 프로시저럴 생성된 도트 맵 렌더링
        if(Sprites.mapCanvas) ctx.drawImage(Sprites.mapCanvas, 0, 0);

        // 2. 캐릭터 렌더링
        Object.values(otherPlayers).forEach(p => drawPxl(p.x, p.y, p.c, p.s, p.n, false, time));
        drawPxl(player.x, player.y, player.char, player.state, myId, true, time);

        // 3. 재해 렌더링
        disasters.forEach(d => {
            ctx.save(); ctx.translate(d.x, d.y);
            // 걷기 처럼 흔들림 효과 애니메이션
            if(d.t === 1) ctx.rotate((time/150) % (Math.PI*2)); 
            let img = d.t === 0 ? Sprites.meteor : Sprites.tornado;
            ctx.drawImage(img, -d.size/2, -d.size/2, d.size, d.size);
            ctx.restore();
        });
        
        ctx.restore();
        requestAnimationFrame(loop);
    }

    function drawPxl(x, y, cIdx, state, name, isMe, time) {
        ctx.save();
        if(state === 'ghost') ctx.globalAlpha = 0.5;
        
        // 걷기 바운스 애니메이션 (이동 중일 때)
        let bounce = (isMe && (keys.x !== 0 || keys.y !== 0)) ? Math.sin(time/50)*4 : 0;
        
        if(Sprites.chars[cIdx]) {
            ctx.drawImage(Sprites.chars[cIdx], x - player.width/2, y - player.height + bounce, player.width, player.height);
        }

        ctx.globalAlpha = 1;
        ctx.fillStyle = '#181425'; ctx.fillRect(x - 30, y - player.height - 20 + bounce, 60, 16);
        ctx.fillStyle = isMe ? '#ffcd75' : '#fff';
        ctx.font = '10px Galmuri11'; ctx.textAlign = 'center';
        ctx.fillText(name, x, y - player.height - 8 + bounce);
        ctx.restore();
    }

    // 초기 리소스 빌드
    initAssets();
</script>
</body>
</html>
