<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survive: 자연재해 무인도</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        /* === 기본 설정 & 자동 비율 조정 === */
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: #0f172a; color: #f8fafc; 
            font-family: 'Noto Sans KR', sans-serif; 
            overflow: hidden; touch-action: none; /* 모바일 스크롤 방지 */
        }

        /* === 화면 및 패널 디자인 === */
        .screen {
            position: absolute; width: 100%; height: 100%; 
            display: flex; align-items: center; justify-content: center; 
            flex-direction: column; z-index: 20;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .screen.active { opacity: 1; pointer-events: auto; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 24px;
            padding: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            text-align: center; max-width: 90%; width: 400px;
            box-sizing: border-box; display: flex; flex-direction: column; gap: 15px;
        }

        h1, h2 { margin: 0; background: linear-gradient(135deg, #38bdf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #cbd5e1; margin: 0 0 10px 0; font-size: 0.95rem; word-break: keep-all; }

        /* === 폼 엘리먼트 === */
        input, select {
            width: 100%; padding: 14px; background: rgba(15, 23, 42, 0.6); 
            border: 1px solid #475569; color: #fff; border-radius: 12px; 
            font-size: 1rem; outline: none; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: #38bdf8; }

        button {
            width: 100%; padding: 16px; background: linear-gradient(135deg, #0ea5e9, #4f46e5);
            color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; 
            cursor: pointer; transition: transform 0.1s, box-shadow 0.2s;
        }
        button:active { transform: scale(0.97); }
        button.secondary { background: rgba(71, 85, 105, 0.8); }

        /* === 캐릭터 선택기 === */
        .char-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 10px;
        }
        .char-card {
            background: rgba(0,0,0,0.4); border: 2px solid transparent; 
            border-radius: 12px; padding: 10px; cursor: pointer; transition: 0.2s;
        }
        .char-card.selected { border-color: #38bdf8; background: rgba(56, 189, 248, 0.2); }
        .char-preview { width: 100%; height: 80px; object-fit: contain; image-rendering: pixelated; }

        /* === 캔버스 및 HUD === */
        #gameCanvas { position: absolute; top: 0; left: 0; z-index: 1; image-rendering: pixelated; }
        
        #inGameHUD {
            position: absolute; top: 20px; left: 20px; z-index: 5; display: none;
        }
        .status-box { 
            background: rgba(15,23,42,0.8); padding: 12px 20px; border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
        }
        .hp-bar-bg { width: 200px; height: 18px; background: #000; border-radius: 9px; margin-top: 8px; overflow: hidden; position: relative;}
        #hpBar { height: 100%; background: #10b981; width: 100%; transition: width 0.2s; }
        
        /* === 모바일 가상 조이스틱 === */
        #joystickZone {
            position: absolute; bottom: 40px; left: 40px; width: 120px; height: 120px; 
            z-index: 10; display: none; /* 게임 진입 시 보임 */
        }
        #joystickBase {
            width: 100%; height: 100%; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; position: relative; backdrop-filter: blur(5px);
        }
        #joystickStick {
            width: 50px; height: 50px; background: rgba(56, 189, 248, 0.8); border-radius: 50%;
            position: absolute; top: 35px; left: 35px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            pointer-events: none; transition: transform 0.05s;
        }
        
        /* 모바일 환경 대응 (가로가 좁을 때 조이스틱 위치 및 크기 조정) */
        @media (max-width: 768px) {
            #joystickZone { bottom: 20px; left: 20px; width: 100px; height: 100px; }
            #joystickStick { width: 40px; height: 40px; top: 30px; left: 30px; }
            .glass-panel { padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- 1. 캐릭터 선택 및 로그인 -->
    <div id="authScreen" class="screen active">
        <div class="glass-panel">
            <h2>생존자 등록</h2>
            <p>플레이할 캐릭터와 이름을 선택하세요.</p>
            
            <div class="char-grid" id="charGrid">
                <!-- 자바스크립트에서 1790248184465.png를 활용해 렌더링 -->
                <div class="char-card selected" onclick="selectChar(0)">캐릭터 1</div>
                <div class="char-card" onclick="selectChar(1)">캐릭터 2</div>
                <div class="char-card" onclick="selectChar(2)">캐릭터 3</div>
                <div class="char-card" onclick="selectChar(3)">캐릭터 4</div>
            </div>

            <input type="text" id="username" placeholder="닉네임 입력" required>
            <button onclick="joinLobby()">무인도 진입</button>
        </div>
    </div>

    <!-- 2. 방 만들기 / 참가 (로비 UI) -->
    <div id="roomScreen" class="screen">
        <div class="glass-panel">
            <h2>네트워크 통신</h2>
            <p>생존자들과 그룹을 생성하거나 합류하세요.</p>
            
            <select id="userType" onchange="document.getElementById('studentOptions').style.display = this.value === 'student' ? 'block' : 'none'">
                <option value="general">일반 생존자</option>
                <option value="student">학생 생존자 (교육 모드)</option>
            </select>
            
            <div id="studentOptions" style="display: none;">
                <select id="grade"><option>1학년</option><option>6학년</option></select>
            </div>
            
            <button onclick="createRoom()">호스트로 방 생성</button>
            <hr style="border: 0; border-top: 1px solid #334155; width: 100%;">
            <input type="text" id="joinCode" placeholder="입장 코드 (3자리)" maxlength="3" style="text-transform: uppercase;">
            <button onclick="joinRoom()" style="background: #10b981;">코드 입력 후 합류</button>
            <button class="secondary" onclick="closeRoomUI()">닫기</button>
        </div>
    </div>

    <!-- 게임 렌더링 영역 -->
    <canvas id="gameCanvas"></canvas>
    
    <!-- 모바일 조이스틱 -->
    <div id="joystickZone">
        <div id="joystickBase">
            <div id="joystickStick"></div>
        </div>
    </div>

    <!-- 게임 내 HUD -->
    <div id="inGameHUD">
        <div class="status-box">
            <div style="font-weight: 900; color: #38bdf8;">생존 시간: <span id="timeDisplay">0</span>초</div>
            <div class="hp-bar-bg">
                <div id="hpBar"></div>
            </div>
            <div id="hpText" style="font-size: 12px; text-align: center; margin-top: 4px; font-weight: bold;">100 / 100</div>
        </div>
    </div>

<script>
    /* === 1. 리소스 매니저 (제공된 파일명 준수) === */
    const IMAGES = {
        lobby: new Image(), city: new Image(), disasters: new Image(), characters: new Image()
    };
    IMAGES.lobby.src = '1790245071083.png';
    IMAGES.city.src = '1790245410543.png';
    IMAGES.disasters.src = '1790245888729.png';
    IMAGES.characters.src = '1790248184465.png';

    /* === 2. 코어 엔진 변수 === */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let gameState = 'auth'; // auth, lobby, playing
    
    // 캐릭터 및 카메라 세팅
    const camera = { x: 0, y: 0, targetX: 0, targetY: 0, zoom: 2.0 };
    const player = {
        x: 500, y: 500, width: 64, height: 64, speed: 7,
        hp: 100, maxHp: 100, state: 'alive', reviveClicks: 0,
        charIndex: 0, name: '', moving: false
    };
    
    // 네트워크 및 조이스틱 상태
    const keys = { x: 0, y: 0 }; // 조이스틱 및 키보드 입력 벡터 (-1.0 ~ 1.0)
    let peer = null, connections = [], roomCode = '', isHost = false, otherPlayers = {};
    let disasters = [], gameTime = 0, lastTime = performance.now();

    /* === 3. 디바이스 해상도 완벽 대응 (GUI 찌그러짐 방지) === */
    function resize() {
        const dpr = window.devicePixelRatio || 1;
        width = window.innerWidth;
        height = window.innerHeight;
        // 캔버스의 실제 픽셀 수를 디바이스 비율에 맞춰 뻥튀기합니다.
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        // CSS 크기는 창 크기와 동일하게 맞춥니다.
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        // 렌더링 컨텍스트를 스케일링하여 비율을 교정합니다.
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    /* === 4. 캐릭터 선택 및 UI 컨트롤 === */
    function selectChar(index) {
        player.charIndex = index;
        document.querySelectorAll('.char-card').forEach((card, i) => {
            card.className = 'char-card' + (i === index ? ' selected' : '');
        });
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        if(screenId) document.getElementById(screenId).classList.add('active');
    }

    function joinLobby() {
        const name = document.getElementById('username').value.trim();
        if(!name) return alert('이름을 입력해주세요.');
        player.name = name;
        switchScreen(null);
        gameState = 'lobby';
        // 게임 환경에 진입하면 모바일 조이스틱을 켭니다.
        document.getElementById('joystickZone').style.display = 'block';
        requestAnimationFrame(gameLoop);
    }

    function closeRoomUI() {
        switchScreen(null);
        gameState = 'lobby';
        player.y += 100; // 연속 팝업 방지를 위해 아래로 이동시킵니다.
    }

    /* === 5. 가상 조이스틱 로직 (모바일 쾌적화) === */
    const joyZone = document.getElementById('joystickZone');
    const joyStick = document.getElementById('joystickStick');
    const joyBase = document.getElementById('joystickBase');
    let joyActive = false, joyOrigin = { x: 0, y: 0 }, maxJoyDist = 40;

    joyZone.addEventListener('touchstart', (e) => {
        joyActive = true;
        const rect = joyBase.getBoundingClientRect();
        joyOrigin.x = rect.left + rect.width / 2;
        joyOrigin.y = rect.top + rect.height / 2;
        updateJoystick(e.touches[0]);
    });
    
    joyZone.addEventListener('touchmove', (e) => {
        if(!joyActive) return;
        e.preventDefault(); // 화면 스크롤 방지
        updateJoystick(e.touches[0]);
    });
    
    joyZone.addEventListener('touchend', () => {
        joyActive = false;
        joyStick.style.transform = `translate(0px, 0px)`;
        keys.x = 0; keys.y = 0; // 입력 초기화
    });

    function updateJoystick(touch) {
        let dx = touch.clientX - joyOrigin.x;
        let dy = touch.clientY - joyOrigin.y;
        let distance = Math.hypot(dx, dy);
        
        // 스틱이 베이스 밖으로 나가지 않도록 제한합니다.
        if (distance > maxJoyDist) {
            dx = (dx / distance) * maxJoyDist;
            dy = (dy / distance) * maxJoyDist;
        }
        
        joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
        
        // 게임 내 이동을 위해 정규화된 벡터(-1.0 ~ 1.0)를 저장합니다.
        keys.x = dx / maxJoyDist;
        keys.y = dy / maxJoyDist;
    }

    /* 키보드 입력 대응 (PC) */
    window.addEventListener('keydown', e => {
        if(e.key === 'ArrowUp' || e.key === 'w') keys.y = -1;
        if(e.key === 'ArrowDown' || e.key === 's') keys.y = 1;
        if(e.key === 'ArrowLeft' || e.key === 'a') keys.x = -1;
        if(e.key === 'ArrowRight' || e.key === 'd') keys.x = 1;
    });
    window.addEventListener('keyup', e => {
        if(['ArrowUp', 'w', 'ArrowDown', 's'].includes(e.key)) keys.y = 0;
        if(['ArrowLeft', 'a', 'ArrowRight', 'd'].includes(e.key)) keys.x = 0;
    });

    /* 부활 터치 시스템 (화면 클릭) */
    canvas.addEventListener('pointerdown', e => {
        if(gameState !== 'playing') return;
        // 터치 좌표를 카메라 줌에 맞춰 월드 좌표로 변환합니다.
        const wx = (e.clientX - width/2) / camera.zoom + camera.x;
        const wy = (e.clientY - height/2) / camera.zoom + camera.y;
        
        Object.keys(otherPlayers).forEach(id => {
            let op = otherPlayers[id];
            if(op.state === 'ghost' && Math.hypot(op.x - wx, op.y - wy) < 80) {
                let conn = connections.find(c => c.peer === id);
                if(conn && conn.open) conn.send({type: 'revive'});
            }
        });
    });

    /* === 6. 네트워크 통신 (PeerJS) === */
    function initPeer(id, callback) {
        peer = new Peer("svr_korea_" + id);
        peer.on('open', callback);
        peer.on('connection', conn => {
            if(!connections.includes(conn)) connections.push(conn);
            conn.on('data', data => {
                if(data.type === 'update') otherPlayers[conn.peer] = data.p;
                else if(data.type === 'start') startGame();
                else if(data.type === 'revive' && player.state === 'ghost') {
                    player.reviveClicks++;
                    if(player.reviveClicks >= 5) {
                        player.state = 'alive'; player.hp = 50; player.reviveClicks = 0;
                    }
                }
            });
        });
    }

    function createRoom() {
        roomCode = Math.random().toString(36).substring(2, 5).toUpperCase();
        isHost = true;
        initPeer(roomCode, () => { alert('방 생성 완료! 코드: ' + roomCode); switchScreen(null); startGame(); });
    }

    function joinRoom() {
        roomCode = document.getElementById('joinCode').value.toUpperCase();
        initPeer("usr_" + Math.random().toString(36).substring(2, 6), () => {
            const conn = peer.connect("svr_korea_" + roomCode);
            conn.on('open', () => { alert('접속 성공! 호스트 대기 중.'); switchScreen(null); });
        });
    }

    function startGame() {
        gameState = 'playing';
        document.getElementById('inGameHUD').style.display = 'block';
        player.x = 800; player.y = 800; // 맵 중앙
        if(isHost) {
            connections.forEach(c => c.send({type: 'start'}));
            setInterval(() => { gameTime++; document.getElementById('timeDisplay').innerText = gameTime; }, 1000);
            setInterval(() => {
                let scale = 1 + (gameTime * 0.03);
                disasters.push({ x: player.x + (Math.random()-0.5)*1000, y: player.y - 800, vy: (Math.random()*4 + 4)*scale, size: 100*scale });
            }, 1200);
        }
    }

    /* === 7. 코어 게임 루프 === */
    function gameLoop(timestamp) {
        if(gameState === 'auth') return;
        
        // 이동 로직 (조이스틱/키보드 벡터 사용)
        const spd = player.state === 'ghost' ? player.speed * 0.4 : player.speed;
        player.x += keys.x * spd;
        player.y += keys.y * spd;
        player.moving = (keys.x !== 0 || keys.y !== 0);

        // 로비에서 북쪽(가운데)으로 이동 시 방 만들기 UI 노출
        if (gameState === 'lobby' && player.y < height * 0.25) {
            switchScreen('roomScreen');
        }

        // 호스트 재해 처리 및 카메라 추적
        if(gameState === 'playing') {
            camera.targetX = player.x; camera.targetY = player.y;
            camera.x += (camera.targetX - camera.x) * 0.1;
            camera.y += (camera.targetY - camera.y) * 0.1;

            if(isHost) {
                for(let i = disasters.length - 1; i >= 0; i--) {
                    let d = disasters[i]; d.y += d.vy;
                    if(player.state === 'alive' && Math.hypot(player.x - d.x, player.y - d.y) < d.size * 0.4) {
                        player.hp -= 10; disasters.splice(i, 1);
                        if(player.hp <= 0) { player.hp = 0; player.state = 'ghost'; }
                        continue;
                    }
                    if(d.y > camera.y + height) disasters.splice(i, 1);
                }
            }
            
            // HUD 업데이트
            const bar = document.getElementById('hpBar');
            const txt = document.getElementById('hpText');
            bar.style.width = Math.max(0, (player.hp / player.maxHp) * 100) + '%';
            if(player.state === 'ghost') {
                bar.style.background = 'transparent'; txt.innerText = `유령 (터치 ${player.reviveClicks}/5)`; txt.style.color = '#38bdf8';
            } else {
                bar.style.background = player.hp < 30 ? '#ef4444' : '#10b981'; txt.innerText = `${player.hp} / ${player.maxHp}`; txt.style.color = '#fff';
            }
        }
        
        // 네트워크 브로드캐스트
        if(Math.floor(timestamp) % 4 === 0 && peer) {
            connections.forEach(c => {
                if(c.open) c.send({type: 'update', p: { x: player.x, y: player.y, s: player.state, c: player.charIndex, n: player.name }});
            });
        }

        /* --- 그리기(Render) 순서 (Z-index 엄격 적용) --- */
        ctx.clearRect(0, 0, width, height);

        if(gameState === 'lobby') {
            // 레이어 1: 로비 맵 배경
            if(IMAGES.lobby.complete) ctx.drawImage(IMAGES.lobby, 0, 0, width, height);
            // 레이어 2: 플레이어
            drawSprite(player.x, player.y, player, true);
            
        } else if(gameState === 'playing') {
            ctx.save();
            ctx.translate(width / 2, height / 2);
            ctx.scale(camera.zoom, camera.zoom);
            ctx.translate(-camera.x, -camera.y);

            // 레이어 1: 메인 맵 배경 (가장 밑에 깔림)
            if(IMAGES.city.complete) ctx.drawImage(IMAGES.city, 0, 0);

            // 레이어 2: 타 플레이어 및 나 (맵 위에 그려짐)
            Object.values(otherPlayers).forEach(p => drawSprite(p.x, p.y, p, false));
            drawSprite(player.x, player.y, player, true);

            // 레이어 3: 자연재해 (가장 위에 그려져 플레이어를 덮음)
            if(IMAGES.disasters.complete) {
                disasters.forEach(d => {
                    ctx.drawImage(IMAGES.disasters, 0, 0, 128, 128, d.x - d.size/2, d.y - d.size/2, d.size, d.size);
                });
            }
            ctx.restore();
        }

        requestAnimationFrame(gameLoop);
    }

    function drawSprite(x, y, pData, isMe) {
        ctx.save();
        if(pData.s === 'ghost' || pData.state === 'ghost') ctx.globalAlpha = 0.5;

        if(IMAGES.characters.complete) {
            // 4명의 캐릭터가 가로로 나열되어 있다고 가정한 Crop 좌표 계산[span_0](start_span)[span_0](end_span)
            const spriteW = IMAGES.characters.width / 4; 
            const spriteH = IMAGES.characters.height;
            const charIdx = pData.c !== undefined ? pData.c : player.charIndex;
            
            ctx.drawImage(IMAGES.characters, charIdx * spriteW, 0, spriteW, spriteH, x - player.width/2, y - player.height, player.width, player.height);
        } else {
            ctx.fillStyle = isMe ? '#38bdf8' : '#f43f5e';
            ctx.fillRect(x - player.width/2, y - player.height, player.width, player.height);
        }

        // 이름 텍스트 출력
        ctx.globalAlpha = 1; ctx.fillStyle = isMe ? '#bef264' : '#fff';
        ctx.font = '14px Noto Sans KR'; ctx.textAlign = 'center';
        ctx.fillText(pData.n || player.name, x, y - player.height - 10);
        ctx.restore();
    }
</script>
</body>
</html>
