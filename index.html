<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE: PIXEL CITY</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
    <style>
        /* === 레트로 픽셀 아트 베이스 === */
        * { box-sizing: border-box; image-rendering: pixelated; font-family: 'Galmuri11', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111; color: #fff; overflow: hidden; touch-action: none; user-select: none; }
        
        /* 스캔라인 효과 */
        body::after { content: ""; display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.15) 50%); background-size: 100% 4px; z-index: 999; pointer-events: none; }

        .view { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; }
        .view.active { display: flex; }

        /* === 픽셀 UI 컴포넌트 === */
        .pixel-panel { background: #222; border: 4px solid #fff; box-shadow: inset -4px -4px 0px 0px #000, 6px 6px 0px 0px rgba(0,0,0,0.8); padding: 30px; width: 90%; max-width: 500px; text-align: center; position: relative; }
        .pixel-title { color: #facc15; font-size: 32px; text-shadow: 3px 3px 0px #b91c1c, 6px 6px 0px #000; margin: 0 0 25px 0; letter-spacing: 2px; }
        .pixel-input, .pixel-select { width: 100%; padding: 14px; margin-bottom: 15px; background: #111; color: #fff; border: 4px solid #555; font-size: 16px; outline: none; }
        .pixel-input:focus, .pixel-select:focus { border-color: #facc15; }
        .pixel-btn { width: 100%; padding: 16px; margin-bottom: 12px; background: #b91c1c; color: #fff; border: 4px solid #fff; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.5), 4px 4px 0px 0px #000; text-shadow: 2px 2px 0px #000; transition: 0.1s; }
        .pixel-btn:active { box-shadow: inset 4px 4px 0px 0px rgba(0,0,0,0.5), 0 0 0 0 #000; transform: translate(4px, 4px); }
        .pixel-btn.blue { background: #0284c7; } .pixel-btn.green { background: #16a34a; } .pixel-btn.dark { background: #444; }

        .tabs { display: flex; margin-bottom: 20px; border-bottom: 4px solid #555; }
        .tab { flex: 1; padding: 12px; background: #222; cursor: pointer; color: #888; font-weight: bold; }
        .tab.active { background: #555; color: #fff; border: 4px solid #fff; border-bottom: none; }

        .char-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .char-box { background: #111; border: 2px solid #555; padding: 10px; cursor: pointer; display: flex; justify-content: center; }
        .char-box.selected { border-color: #facc15; background: #333; transform: scale(1.05); }
        .char-preview { width: 48px; height: 48px; }

        /* === 게임 HUD 및 시스템 메시지 === */
        #gameCanvas { position: absolute; top: 0; left: 0; z-index: 1; }
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 5; display: none; justify-content: space-between; pointer-events: none; }
        .info-box { background: rgba(30,30,30,0.9); border: 4px solid #fff; padding: 10px 15px; box-shadow: 4px 4px 0px #000; font-size: 16px; margin-bottom: 10px; display: inline-block;}
        .hp-frame { border: 4px solid #fff; background: #000; width: 220px; height: 26px; position: relative; box-shadow: 4px 4px 0px #000; }
        #hpBar { height: 100%; background: #16a34a; width: 100%; transition: width 0.2s; }
        .hp-text { position: absolute; top: 2px; width: 100%; text-align: center; font-weight: bold; text-shadow: 2px 2px 0px #000; font-size: 14px;}
        
        /* 시스템 로그 UI */
        #sysLog { position: absolute; bottom: 30px; left: 15px; width: 300px; max-height: 150px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; z-index: 6; pointer-events: none; }
        .log-msg { background: rgba(0,0,0,0.6); color: #facc15; padding: 5px 10px; font-size: 14px; margin-top: 5px; border-left: 4px solid #facc15; animation: slideIn 0.3s ease-out; text-shadow: 1px 1px 0 #000;}
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        
        .alert-box { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background: #b91c1c; border: 4px solid #fff; padding: 10px 20px; font-size: 20px; color: #fff; display: none; z-index: 6; box-shadow: 4px 4px 0 #000; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.05); } }

        /* 조이스틱 */
        #joyZone { position: absolute; bottom: 30px; right: 30px; width: 140px; height: 140px; z-index: 10; display: none; pointer-events: auto; }
        #joyBase { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.1); border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; position: relative; }
        #joyStick { width: 60px; height: 60px; background: rgba(250, 204, 21, 0.8); border: 4px solid #fff; border-radius: 50%; position: absolute; top: 36px; left: 36px; pointer-events: none; }
    </style>
</head>
<body>

    <!-- 1. 로그인/가입 -->
    <div id="authView" class="view active">
        <div class="pixel-panel">
            <h1 class="pixel-title">SURVIVE<br><span style="font-size: 24px; color:#fff;">CITY</span></h1>
            <div class="tabs">
                <div class="tab active" id="tabL" onclick="switchTab('L')">로그인</div>
                <div class="tab" id="tabS" onclick="switchTab('S')">회원가입</div>
            </div>
            <div id="formL">
                <input type="text" id="loginId" class="pixel-input" placeholder="아이디">
                <input type="password" id="loginPw" class="pixel-input" placeholder="비밀번호">
                <button class="pixel-btn" onclick="processLogin()">도시 진입</button>
            </div>
            <div id="formS" style="display: none;">
                <input type="text" id="regId" class="pixel-input" placeholder="생성할 아이디">
                <input type="password" id="regPw" class="pixel-input" placeholder="비밀번호">
                <button class="pixel-btn blue" onclick="processSignup()">생존자 등록</button>
            </div>
        </div>
    </div>

    <!-- 2. 대기실 -->
    <div id="lobbyView" class="view">
        <div class="pixel-panel" style="max-width: 550px;">
            <h2 class="pixel-title" style="font-size: 28px;">안전 가옥 (로비)</h2>
            <div style="text-align: left; margin-bottom: 5px; color:#aaa;">캐릭터 요원 선택</div>
            <div class="char-grid">
                <div class="char-box selected" onclick="selectChar(0)"><canvas id="cp0" class="char-preview"></canvas></div>
                <div class="char-box" onclick="selectChar(1)"><canvas id="cp1" class="char-preview"></canvas></div>
                <div class="char-box" onclick="selectChar(2)"><canvas id="cp2" class="char-preview"></canvas></div>
                <div class="char-box" onclick="selectChar(3)"><canvas id="cp3" class="char-preview"></canvas></div>
            </div>

            <div style="display: flex; gap: 10px;">
                <select id="userType" class="pixel-select" onchange="document.getElementById('gradeSelect').style.display = this.value==='student'?'inline-block':'none'">
                    <option value="general">일반 생존 모드</option>
                    <option value="student">학생 교육 모드 (재해 문제)</option>
                </select>
                <select id="gradeSelect" class="pixel-select" style="display:none; width: 140px;">
                    <option>1학년</option><option>2학년</option><option>3학년</option><option>4학년</option><option>5학년</option><option selected>6학년</option>
                </select>
            </div>

            <hr style="border: 2px solid #555; margin: 15px 0;">
            <button class="pixel-btn green" onclick="createRoom()">👑 방 생성 (호스트)</button>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="text" id="joinCode" class="pixel-input" style="margin: 0; text-transform: uppercase;" placeholder="코드입력 (3자리)" maxlength="3">
                <button class="pixel-btn blue" style="margin: 0; width: 130px;" onclick="joinRoom()">참가</button>
            </div>
        </div>
    </div>

    <!-- 3. 인게임 -->
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div style="pointer-events: auto;">
            <div class="info-box">
                <span style="color:#facc15;">⏱️ 생존:</span> <span id="timeVal">0</span>초<br>
                <span style="color:#0ea5e9; font-size: 14px;">📡 코드: <span id="hudCode"></span></span>
            </div>
            <div class="hp-frame">
                <div id="hpBar"></div>
                <div class="hp-text" id="hpText">100 / 100</div>
            </div>
        </div>
        <div style="pointer-events: auto;">
            <button class="pixel-btn dark" style="padding: 10px; font-size: 14px;" onclick="alert('상점/설정 업데이트 예정')">설정</button>
        </div>
    </div>
    
    <div id="sysLog"></div>
    <div id="disasterAlert" class="alert-box">🌊 쓰나미 접근! 옥상(계단 위)으로 대피!</div>
    <div id="joyZone"><div id="joyBase"><div id="joyStick"></div></div></div>

<script>
    /* =========================================================================
       [ 1. 완전한 픽셀 에셋 렌더링 엔진 (메테오, 쓰나미, 맵 모두 배열 픽셀화) ]
       ========================================================================= */
    const Pal = {
        '0': null, '1': '#000000', '2': '#fcd34d', '3': '#b91c1c', '4': '#0ea5e9', 
        '5': '#22c55e', '6': '#8b5cf6', '7': '#ffffff', '8': '#9ca3af', '9': '#374151',
        'a': '#7f1d1d', 'b': '#475569', 'c': '#06b6d4', 'd': '#d97706', 'e': '#ea580c'
    };

    // 캐릭터 및 몬스터 픽셀 배열 (16x16)
    const SpriteData = {
        agent0: ["0000011111100000","0000133333310000","0001333333331000","0001122222211000","0012211221122100","0012222222222100","0012122222212100","0001111111111000","0000133333310000","0001331331331000","0001713333171000","0001713333171000","0000111111110000","0000111001110000","0001111001111000","0001111001111000"],
        agent1: ["0000011111100000","0000144444410000","0001444444441000","0001122222211000","0012211221122100","0012222222222100","0012122222212100","0001111111111000","0000144444410000","0001441441441000","0001714444171000","0001714444171000","0000111111110000","0000111001110000","0001111001111000","0001111001111000"],
        agent2: ["0000011111100000","0000155555510000","0001555555551000","0001122222211000","0012211221122100","0012222222222100","0012122222212100","0001111111111000","0000155555510000","0001551551551000","0001715555171000","0001715555171000","0000111111110000","0000111001110000","0001111001111000","0001111001111000"],
        agent3: ["0000011111100000","0000166666610000","0001666666661000","0001122222211000","0012211221122100","0012222222222100","0012122222212100","0001111111111000","0000166666610000","0001661661661000","0001716666171000","0001716666171000","0000111111110000","0000111001110000","0001111001111000","0001111001111000"],
        zombie: ["0000011111100000","0000155555510000","0001555555551000","0001155555511000","0015511551155100","0155555555555510","0155555115555510","0111111111111110","1551188888811551","1551888888881551","1111888888881111","0001888888881000","0000111111110000","0000111001110000","0001111001111000","0001111001111000"],
        meteor: ["0000111100000000","0001ee3e11000000","001e33333e100000","01e311333e100000","0131111331000000","1e3111113e100000","1e3111113e100000","1e3311133e100000","0133333331000000","01e33333e1000000","001ee33ee1000000","00011ee110000000","0000011000000000","0000000000000000","0000000000000000","0000000000000000"],
        wave:   ["000000cc00000000","0000cccccccc0000","00cccccccccccc00","0cccccccccccccc0","cccccccccccccccc","cccccccccccccccc","cccccccccccccccc","cccccccccccccccc","cccccccccccccccc","cccccccccccccccc","cccccccccccccccc","cccccccccccccccc","cccccccccccccccc","cccccccccccccccc","cccccccccccccccc","cccccccccccccccc"],
        sand:   ["0000000000000000","000d0000000d0000","0000000d00000000","00d0000000000d00","000000d000d00000","000d000000000000","00000000d000000d","00d0000d00000000","0000000000d00000","0000d000000000d0","00d00000d0000000","000000000000d000","0d0000d000000000","0000000000d00000","0000d0000000000d","0000000000000000"]
    };

    const Tiles = {
        road: ["9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999","9999999999999999"],
        walk: ["8888888888888888","8888888888888888","8877888888887788","8877888888887788","8888888888888888","8888888888888888","8888888888888888","8888888888888888","8888888888888888","8888888888888888","8877888888887788","8877888888887788","8888888888888888","8888888888888888","8888888888888888","8888888888888888"],
        roof: ["bbbbbbbbbbbbbbbb","baaaaaaaaaaaaaab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","babbbbbbbbbbbbab","baaaaaaaaaaaaaab","bbbbbbbbbbbbbbbb"],
        stair:["8888888888888888","7777777777777777","8888888888888888","7777777777777777","8888888888888888","7777777777777777","8888888888888888","7777777777777777","8888888888888888","7777777777777777","8888888888888888","7777777777777777","8888888888888888","7777777777777777","8888888888888888","7777777777777777"]
    };

    const Sprites = { c:[], e:{} };
    function mkSpr(d) {
        let c = document.createElement('canvas'); c.width=16; c.height=16; let cx = c.getContext('2d');
        for(let y=0; y<16; y++) for(let x=0; x<16; x++) if(Pal[d[y][x]]) { cx.fillStyle=Pal[d[y][x]]; cx.fillRect(x,y,1,1); }
        return c;
    }

    const T_SIZE = 64; 
    const COLS = 30, ROWS = 30; // 1920x1920
    let mapGrid = [];

    function generateMap() {
        const mc = document.createElement('canvas'); mc.width = COLS*T_SIZE; mc.height = ROWS*T_SIZE;
        const cx = mc.getContext('2d'); cx.imageSmoothingEnabled = false;
        
        let tR = mkSpr(Tiles.road), tW = mkSpr(Tiles.walk), tB = mkSpr(Tiles.roof), tS = mkSpr(Tiles.stair);
        
        mapGrid = Array(ROWS).fill().map(()=>Array(COLS).fill('road'));

        for(let y=0; y<ROWS; y++) {
            for(let x=0; x<COLS; x++) {
                // 도로 패턴 (3칸마다 도로, 나머지는 블록)
                if(x%6 < 2 || y%6 < 2) { 
                    cx.drawImage(tR, x*T_SIZE, y*T_SIZE, T_SIZE, T_SIZE);
                    // 중앙 차선
                    if(x%6 === 0 && y%6 >= 2) { cx.fillStyle='#facc15'; cx.fillRect(x*T_SIZE + T_SIZE-4, y*T_SIZE+10, 8, 20); }
                    if(y%6 === 0 && x%6 >= 2) { cx.fillStyle='#facc15'; cx.fillRect(x*T_SIZE+10, y*T_SIZE + T_SIZE-4, 20, 8); }
                } else {
                    // 블록 내부 (건물)
                    let isCenter = (x%6===3 || x%6===4) && (y%6===3 || y%6===4);
                    let isStair = (x%6===3 && y%6===5) || (x%6===4 && y%6===5); // 남쪽에 계단
                    
                    if(isCenter) {
                        mapGrid[y][x] = 'roof';
                        // 그림자 및 벽면 입체감
                        cx.fillStyle = '#000'; cx.fillRect(x*T_SIZE+8, y*T_SIZE+8, T_SIZE, T_SIZE);
                        cx.drawImage(tB, x*T_SIZE, y*T_SIZE, T_SIZE, T_SIZE);
                        // H 마크 (헬기장)
                        if(x%6===3 && y%6===3) { cx.fillStyle='#fff'; cx.font='20px Galmuri11'; cx.fillText('H', x*T_SIZE+T_SIZE-10, y*T_SIZE+T_SIZE-10); }
                    } else if(isStair) {
                        mapGrid[y][x] = 'stair';
                        cx.drawImage(tS, x*T_SIZE, y*T_SIZE, T_SIZE, T_SIZE);
                    } else {
                        mapGrid[y][x] = 'walk';
                        cx.drawImage(tW, x*T_SIZE, y*T_SIZE, T_SIZE, T_SIZE);
                    }
                }
            }
        }
        Sprites.map = mc;
    }

    function initAssets() {
        for(let i=0; i<4; i++) { Sprites.c[i] = mkSpr(SpriteData['agent'+i]); let x=document.getElementById('cp'+i).getContext('2d'); x.imageSmoothingEnabled=false; x.drawImage(Sprites.c[i],0,0,48,48); }
        Sprites.e.zombie = mkSpr(SpriteData.zombie);
        Sprites.e.meteor = mkSpr(SpriteData.meteor);
        Sprites.e.wave = mkSpr(SpriteData.wave);
        Sprites.e.sand = mkSpr(SpriteData.sand);
        generateMap();
    }

    /* =========================================================================
       [ 2. 로그인, UI 및 멀티플레이 호스트-클라이언트 구조 ]
       ========================================================================= */
    let myId = '';
    function switchTab(t) { document.getElementById('tabL').className='tab'+(t==='L'?' active':''); document.getElementById('tabS').className='tab'+(t==='S'?' active':''); document.getElementById('formL').style.display=t==='L'?'block':'none'; document.getElementById('formS').style.display=t==='S'?'block':'none'; }
    function processSignup() { let i=document.getElementById('regId').value.trim(); if(!i) return; alert('가입 완료'); switchTab('L'); document.getElementById('loginId').value=i; }
    function processLogin() { myId = document.getElementById('loginId').value.trim(); if(!myId) return; document.querySelectorAll('.view').forEach(e=>e.classList.remove('active')); document.getElementById('lobbyView').classList.add('active'); }
    function selectChar(i) { player.char = i; document.querySelectorAll('.char-box').forEach((e, idx) => e.className = 'char-box'+(idx===i?' selected':'')); }

    // 시스템 메시지 처리 함수
    function logMsg(text) {
        let box = document.getElementById('sysLog');
        let div = document.createElement('div'); div.className = 'log-msg'; div.innerText = text;
        box.appendChild(div);
        setTimeout(() => { div.style.opacity=0; setTimeout(()=>div.remove(), 300); }, 4000);
    }

    const player = { x: 0, y: 0, w: 40, h: 40, speed: 7, hp: 100, state: 'alive', char: 0, revive: 0, id: '' };
    const camera = { x: 0, y: 0, zoom: 1.2 };
    
    // 호스트가 관리하는 전체 게임 상태 (이 데이터를 클라이언트에게 뿌림)
    let GameState = { players: {}, disasters: [], zombies: [], isSandstorm: false, time: 0 };
    
    let peer = null, connections = [], roomCode = '', isHost = false;
    let keys = {x:0, y:0};
    const cvs = document.getElementById('gameCanvas'); const ctx = cvs.getContext('2d');
    let W, H;
    
    function resize() { W = cvs.width = window.innerWidth; H = cvs.height = window.innerHeight; ctx.imageSmoothingEnabled = false; }
    window.addEventListener('resize', resize); resize();

    function initPeer(id, cb) {
        peer = new Peer("px_city_" + id);
        peer.on('open', cb);
        peer.on('connection', c => {
            if(!connections.includes(c)) connections.push(c);
            
            c.on('data', d => {
                if(isHost) {
                    // [호스트 역할] 클라이언트의 입력 및 조인 처리
                    if(d.type === 'join') {
                        GameState.players[c.peer] = { x: (COLS*T_SIZE)/2, y: (ROWS*T_SIZE)/2, c: d.char, n: d.name, s: 'alive', hp: 100 };
                        logMsg(`[시스템] ${d.name} 님이 도시에 진입했습니다.`);
                        // 모든 클라이언트에게 조인 메시지 브로드캐스트
                        connections.forEach(conn => { if(conn.open) conn.send({type:'msg', text:`[시스템] ${d.name} 님이 도시에 진입했습니다.`}); });
                    }
                    else if(d.type === 'input') {
                        if(GameState.players[c.peer]) {
                            GameState.players[c.peer].x = d.x; GameState.players[c.peer].y = d.y;
                            GameState.players[c.peer].s = d.s; GameState.players[c.peer].hp = d.hp;
                        }
                    }
                } else {
                    // [클라이언트 역할] 호스트가 보내주는 풀 데이터 수신
                    if(d.type === 'sync') GameState = d.state;
                    else if(d.type === 'msg') logMsg(d.text);
                    else if(d.type === 'start') startGame();
                }
            });
        });
    }

    function createRoom() {
        roomCode = Math.random().toString(36).substring(2,5).toUpperCase(); isHost = true;
        initPeer(roomCode, () => { alert('방 생성 완료! '+roomCode); startGame(); });
    }
    
    function joinRoom() {
        roomCode = document.getElementById('joinCode').value.toUpperCase(); if(!roomCode) return;
        initPeer("u_"+Math.random().toString(36).substring(2,6), () => {
            let c = peer.connect("px_city_" + roomCode);
            c.on('open', () => { 
                connections.push(c); 
                c.send({type: 'join', name: myId, char: player.char});
                alert('접속 성공! 호스트 시작 대기...'); 
            });
        });
    }

    function startGame() {
        document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('joyZone').style.display = 'block';
        document.getElementById('hudCode').innerText = roomCode;
        
        player.x = (COLS*T_SIZE)/2; player.y = (ROWS*T_SIZE)/2; camera.x=player.x; camera.y=player.y;
        player.id = peer.id;
        
        if(isHost) {
            GameState.players[player.id] = { x: player.x, y: player.y, c: player.char, n: myId, s: 'alive', hp: 100 };
            connections.forEach(c => { if(c.open) c.send({type: 'start'}); });
            setInterval(hostLoop, 1000/30); // 서버 물리 엔진 30FPS
            setInterval(hostDisasterGen, 1000); // 1초마다 이벤트 생성
        }
        logMsg(`[시스템] 게임이 시작되었습니다.`);
        requestAnimationFrame(renderLoop);
    }

    /* =========================================================================
       [ 3. 호스트 전용 게임 엔진 (물리, AI, 재해 생성) ]
       ========================================================================= */
    let sandstormTimer = 0;
    
    function hostDisasterGen() {
        GameState.time++;
        // 메테오
        if(Math.random() < 0.6) GameState.disasters.push({ t: 'meteor', x: player.x + (Math.random()-0.5)*1200, y: player.y - 800, vy: 10+Math.random()*5, sz: 64 });
        // 좀비
        if(GameState.zombies.length < 20 && Math.random() < 0.4) GameState.zombies.push({ x: Math.random()*(COLS*T_SIZE), y: Math.random()*(ROWS*T_SIZE), speed: 3 });
        // 쓰나미 (거대한 y축 라인)
        if(!GameState.disasters.find(d=>d.t==='wave') && Math.random() < 0.05 && GameState.time > 10) GameState.disasters.push({ t: 'wave', y: -800, vy: 5 });
        // 모래폭풍
        if(sandstormTimer <= 0 && Math.random() < 0.1 && GameState.time > 15) sandstormTimer = 10;
        else if(sandstormTimer > 0) sandstormTimer--;
        
        GameState.isSandstorm = sandstormTimer > 0;
    }

    function hostLoop() {
        // 내(호스트) 위치 업데이트
        GameState.players[player.id].x = player.x; GameState.players[player.id].y = player.y;
        GameState.players[player.id].s = player.state; GameState.players[player.id].hp = player.hp;

        // 재해 물리
        for(let i=GameState.disasters.length-1; i>=0; i--) {
            let d = GameState.disasters[i]; d.y += d.vy;
            if(d.t === 'meteor' && d.y > player.y + 1000) GameState.disasters.splice(i,1);
            if(d.t === 'wave' && d.y > (ROWS*T_SIZE)+800) GameState.disasters.splice(i,1);
        }
        
        // 좀비 AI (가장 가까운 플레이어 추적)
        GameState.zombies.forEach(z => {
            let target = null, minDist = 9999;
            Object.values(GameState.players).forEach(p => {
                if(p.s === 'alive') {
                    let d = Math.hypot(p.x - z.x, p.y - z.y);
                    if(d < minDist) { minDist = d; target = p; }
                }
            });
            if(target) { z.x += ((target.x-z.x)/minDist)*z.speed; z.y += ((target.y-z.y)/minDist)*z.speed; }
        });

        // 클라이언트들에게 동기화 브로드캐스트
        connections.forEach(c => { if(c.open) c.send({type: 'sync', state: GameState}); });
    }

    /* =========================================================================
       [ 4. 클라이언트 로컬 물리 및 렌더링 ]
       ========================================================================= */
    const joyZone = document.getElementById('joyZone'), joyStick = document.getElementById('joyStick'), joyBase = document.getElementById('joyBase');
    let jAct = false, jOri = {x:0, y:0}, maxJ = 40;
    joyZone.addEventListener('touchstart', e => { jAct=true; let r=joyBase.getBoundingClientRect(); jOri={x:r.left+r.width/2, y:r.top+r.height/2}; updateJ(e.touches[0]); });
    joyZone.addEventListener('touchmove', e => { if(jAct){ e.preventDefault(); updateJ(e.touches[0]); } });
    joyZone.addEventListener('touchend', () => { jAct=false; joyStick.style.transform=`translate(0,0)`; keys.x=0; keys.y=0; });
    function updateJ(t) { let dx=t.clientX-jOri.x, dy=t.clientY-jOri.y, d=Math.hypot(dx,dy); if(d>maxJ){dx=(dx/d)*maxJ; dy=(dy/d)*maxJ;} joyStick.style.transform=`translate(${dx}px,${dy}px)`; keys.x=dx/maxJ; keys.y=dy/maxJ; }
    window.addEventListener('keydown', e => { if(['w','ArrowUp'].includes(e.key))keys.y=-1; if(['s','ArrowDown'].includes(e.key))keys.y=1; if(['a','ArrowLeft'].includes(e.key))keys.x=-1; if(['d','ArrowRight'].includes(e.key))keys.x=1; });
    window.addEventListener('keyup', e => { if(['w','s','ArrowUp','ArrowDown'].includes(e.key))keys.y=0; if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))keys.x=0; });

    // 부활 시스템
    cvs.addEventListener('pointerdown', e => {
        if(player.state === 'ghost') return;
        const wx = (e.clientX - W/2) / camera.zoom + camera.x, wy = (e.clientY - H/2) / camera.zoom + camera.y;
        Object.keys(GameState.players).forEach(id => {
            let p = GameState.players[id];
            if(p.s === 'ghost' && Math.hypot(p.x - wx, p.y - wy) < 80 && !isHost) {
                let c = connections.find(c => c.peer === id); if(c && c.open) c.send({type: 'revive'});
            }
        });
    });

    let frameCount = 0;

    function renderLoop() {
        frameCount++;
        let pState = isHost ? GameState : GameState; // 뷰 데이터
        
        // 1. 내 캐릭터 물리 (조이스틱 반영)
        let spd = player.state === 'ghost' ? player.speed * 0.5 : player.speed;
        let windX = pState.isSandstorm ? 4 : 0; 
        
        player.x += (keys.x * spd) + windX; player.y += keys.y * spd;
        player.x = Math.max(0, Math.min(player.x, COLS*T_SIZE)); player.y = Math.max(0, Math.min(player.y, ROWS*T_SIZE));
        camera.x += (player.x - camera.x) * 0.1; camera.y += (player.y - camera.y) * 0.1;

        // 2. 고도(지형) 체크 및 데미지 판정
        let tX = Math.floor(player.x / T_SIZE), tY = Math.floor(player.y / T_SIZE);
        let isOnRoof = (mapGrid[tY] && mapGrid[tY][tX] === 'roof'); // 옥상이면 쓰나미 면역
        let tsunamiActive = false;

        if(player.state === 'alive') {
            pState.disasters.forEach(d => {
                if(d.t === 'meteor' && Math.hypot(player.x - d.x, player.y - d.y) < d.sz*0.4) { player.hp -= 15; d.y += 2000; }
                if(d.t === 'wave') {
                    tsunamiActive = true;
                    // 쓰나미 영역 안에 있으면서 옥상이 아니면 데미지!
                    if(player.y > d.y && player.y < d.y + 400 && !isOnRoof) player.hp -= 2;
                }
            });
            pState.zombies.forEach(z => { if(Math.hypot(player.x - z.x, player.y - z.y) < 30) player.hp -= 1; });
            if(player.hp <= 0) { player.hp = 0; player.state = 'ghost'; }
        }
        
        document.getElementById('disasterAlert').style.display = tsunamiActive ? 'block' : 'none';
        document.getElementById('timeVal').innerText = pState.time || 0;

        // 내 상태 서버 전송 (호스트 제외)
        if(!isHost && connections[0] && connections[0].open) {
            connections[0].send({type:'input', x:player.x, y:player.y, s:player.state, hp:player.hp});
        }

        // HUD 반영
        const hpBar = document.getElementById('hpBar'), hpTxt = document.getElementById('hpText');
        hpBar.style.width = Math.max(0, player.hp) + '%';
        if(player.state === 'ghost') { hpBar.style.background = 'transparent'; hpTxt.innerText = `유령 (부활대기)`; hpTxt.style.color = '#0ea5e9'; } 
        else { hpBar.style.background = player.hp < 30 ? '#b91c1c' : '#16a34a'; hpTxt.innerText = `${Math.floor(player.hp)} / 100`; hpTxt.style.color = '#fff'; }

        // --- 렌더링 ---
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.translate(W/2, H/2); ctx.scale(camera.zoom, camera.zoom); ctx.translate(-camera.x, -camera.y);

        // 맵
        if(Sprites.map) ctx.drawImage(Sprites.map, 0, 0);

        // 좀비 그리기
        pState.zombies.forEach(z => {
            let bounce = Math.sin(frameCount/5)*3;
            ctx.drawImage(Sprites.e.zombie, z.x-20, z.y-40+bounce, 40, 40);
        });

        // 플레이어들 (옥상이면 y값을 조금 올려서 공중에 떠있는 입체감 연출)
        Object.keys(pState.players).forEach(id => {
            let p = pState.players[id];
            // 로컬 플레이어 시각 동기화
            if(id === player.id && !isHost) { p.x = player.x; p.y = player.y; p.s = player.state; } 
            
            let p_tX = Math.floor(p.x / T_SIZE), p_tY = Math.floor(p.y / T_SIZE);
            let p_roof = (mapGrid[p_tY] && mapGrid[p_tY][p_tX] === 'roof');
            let zOffset = p_roof ? -15 : 0; // 옥상이면 15픽셀 위로 띄움

            drawPxl(p.x, p.y + zOffset, p.c, p.s, p.n, (id===player.id), frameCount);
        });

        // 재해 그리기
        pState.disasters.forEach(d => {
            if(d.t === 'meteor') ctx.drawImage(Sprites.e.meteor, d.x - d.sz/2, d.y - d.sz/2, d.sz, d.sz);
            else if(d.t === 'wave') {
                // 16x16 물결 패턴을 반복해서 렌더링
                let ptrn = ctx.createPattern(Sprites.e.wave, 'repeat');
                ctx.fillStyle = ptrn;
                ctx.save(); ctx.translate(0, d.y + Math.sin(frameCount/10)*5); 
                ctx.fillRect(0, 0, COLS*T_SIZE, 400);
                ctx.restore();
            }
        });
        ctx.restore();

        // 모래폭풍 픽셀 입자 오버레이
        if(pState.isSandstorm) {
            ctx.fillStyle = 'rgba(217, 119, 6, 0.3)'; ctx.fillRect(0, 0, W, H);
            let ptrn = ctx.createPattern(Sprites.e.sand, 'repeat');
            ctx.fillStyle = ptrn;
            ctx.save();
            ctx.translate((frameCount*10)%W, 0); // 우측으로 흐르는 패턴
            ctx.fillRect(-W, 0, W*2, H);
            ctx.restore();
        }

        requestAnimationFrame(renderLoop);
    }

    function drawPxl(x, y, cIdx, state, name, isMe, time) {
        ctx.save(); if(state === 'ghost') ctx.globalAlpha = 0.5;
        let bounce = (isMe && (keys.x !== 0 || keys.y !== 0)) ? Math.sin(time/5)*4 : 0;
        
        if(Sprites.c[cIdx]) ctx.drawImage(Sprites.c[cIdx], x - player.w/2, y - player.h + bounce, player.w, player.h);

        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(x - 30, y - player.h - 22 + bounce, 60, 16);
        ctx.fillStyle = isMe ? '#facc15' : '#fff';
        ctx.font = '10px Galmuri11'; ctx.textAlign = 'center';
        ctx.fillText(name || '생존자', x, y - 10 - player.h + bounce);
        ctx.restore();
    }

    initAssets();
</script>
</body>
