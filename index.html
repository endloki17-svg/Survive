<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SURVIVE: 50 DISASTERS</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css" rel="stylesheet">
    <style>
        /* === 레트로 픽셀 글로벌 === */
        * { box-sizing: border-box; image-rendering: pixelated; font-family: 'Galmuri11', sans-serif; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; color: #fff; overflow: hidden; touch-action: none; user-select: none; }
        
        /* CRT 스캔라인 & 렌즈 효과 */
        body::after { content: ""; display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.2) 50%); background-size: 100% 4px; z-index: 9999; pointer-events: none; }
        
        .view { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 10; flex-direction: column; align-items: center; justify-content: center; background: #111; }
        .view.active { display: flex; }

        /* === 프리미엄 픽셀 UI === */
        .pixel-panel { background: #1a1a24; border: 4px solid #fff; box-shadow: inset -4px -4px 0px 0px #000, 8px 8px 0px 0px rgba(0,0,0,0.8); padding: 30px; width: 90%; max-width: 450px; text-align: center; }
        .pixel-title { color: #facc15; font-size: 34px; text-shadow: 4px 4px 0px #b91c1c, 6px 6px 0px #000; margin: 0 0 20px 0; letter-spacing: 1px; }
        .pixel-input, .pixel-select { width: 100%; padding: 14px; margin-bottom: 15px; background: #000; color: #fff; border: 4px solid #444; font-size: 16px; outline: none; }
        .pixel-input:focus, .pixel-select:focus { border-color: #facc15; }
        .pixel-btn { width: 100%; padding: 16px; margin-bottom: 12px; background: #b91c1c; color: #fff; border: 4px solid #fff; font-size: 18px; font-weight: bold; cursor: pointer; box-shadow: inset -4px -4px 0px 0px rgba(0,0,0,0.5), 4px 4px 0px 0px #000; text-shadow: 2px 2px 0px #000; transition: 0.1s; }
        .pixel-btn:active { box-shadow: inset 4px 4px 0px 0px rgba(0,0,0,0.5), 0 0 0 0 #000; transform: translate(4px, 4px); }
        .pixel-btn.blue { background: #0284c7; } .pixel-btn.green { background: #16a34a; }
        
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 4px solid #444; }
        .tab { flex: 1; padding: 12px; background: #1a1a24; cursor: pointer; color: #666; font-weight: bold; }
        .tab.active { background: #444; color: #fff; border: 4px solid #fff; border-bottom: none; }
        .char-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
        .char-box { background: #000; border: 2px solid #444; padding: 10px; cursor: pointer; display: flex; justify-content: center; }
        .char-box.selected { border-color: #facc15; background: #222; transform: scale(1.1); box-shadow: 4px 4px 0 #000; }
        .char-preview { width: 48px; height: 48px; }

        /* === 로딩/경고 화면 === */
        #loadingView { background: #000; color: #ff3333; text-align: center; }
        .glitch { font-size: 50px; font-weight: bold; text-shadow: 2px 0 #0ff, -2px 0 #f00; animation: glitch 1s infinite; margin-bottom: 20px; }
        @keyframes glitch { 0% { transform: translate(0) } 20% { transform: translate(-2px, 2px) } 40% { transform: translate(-2px, -2px) } 60% { transform: translate(2px, 2px) } 80% { transform: translate(2px, -2px) } 100% { transform: translate(0) } }
        .progress-bar { width: 80%; max-width: 400px; height: 30px; border: 4px solid #fff; margin: 30px auto; background: #000; position: relative; }
        #progressFill { height: 100%; background: #ff3333; width: 0%; transition: width 3s linear; }

        /* === 인게임 HUD === */
        #gameCanvas { position: absolute; top: 0; left: 0; z-index: 1; }
        #hud { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 5; display: none; justify-content: space-between; pointer-events: none; }
        .info-box { background: rgba(0,0,0,0.8); border: 4px solid #fff; padding: 10px 15px; box-shadow: 4px 4px 0px #000; margin-bottom: 10px; display: inline-block;}
        .hp-frame { border: 4px solid #fff; background: #000; width: 250px; height: 30px; position: relative; box-shadow: 4px 4px 0px #000; }
        #hpBar { height: 100%; background: #16a34a; width: 100%; transition: width 0.2s; }
        .hp-text { position: absolute; top: 3px; width: 100%; text-align: center; font-weight: bold; text-shadow: 2px 2px 0px #000; }
        
        #sysLog { position: absolute; bottom: 30px; left: 15px; width: 320px; z-index: 6; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
        .log-msg { background: rgba(0,0,0,0.7); color: #fff; padding: 6px 12px; border-left: 4px solid #facc15; font-size: 14px; animation: slideIn 0.3s; text-shadow: 1px 1px 0 #000;}
        @keyframes slideIn { from { transform: translateX(-20px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .disaster-alert { position: absolute; top: 100px; left: 50%; transform: translateX(-50%); background: #b91c1c; border: 4px solid #fff; padding: 15px 30px; font-size: 24px; font-weight: bold; color: #fff; display: none; z-index: 6; box-shadow: 6px 6px 0 #000; animation: blinkAlert 0.5s infinite alternate; text-align: center; }
        @keyframes blinkAlert { from { opacity: 1; transform: translateX(-50%) scale(1); } to { opacity: 0.8; transform: translateX(-50%) scale(1.05); } }

        /* 조이스틱 */
        #joyZone { position: absolute; bottom: 40px; right: 40px; width: 150px; height: 150px; z-index: 10; display: none; pointer-events: auto; }
        #joyBase { width: 100%; height: 100%; background: rgba(255, 255, 255, 0.1); border: 4px solid rgba(255,255,255,0.4); border-radius: 50%; position: relative; }
        #joyStick { width: 60px; height: 60px; background: rgba(250, 204, 21, 0.8); border: 4px solid #fff; border-radius: 50%; position: absolute; top: 41px; left: 41px; pointer-events: none; }
    </style>
</head>
<body>

    <!-- 1. 인증 화면 -->
    <div id="authView" class="view active">
        <div class="pixel-panel">
            <h1 class="pixel-title">SURVIVE<br><span style="font-size: 20px; color:#fff;">50 DISASTERS</span></h1>
            <div class="tabs">
                <div class="tab active" id="tabL" onclick="switchTab('L')">로그인</div>
                <div class="tab" id="tabS" onclick="switchTab('S')">회원가입</div>
            </div>
            <div id="formL">
                <input type="text" id="loginId" class="pixel-input" placeholder="아이디를 입력하세요">
                <input type="password" class="pixel-input" placeholder="비밀번호">
                <button class="pixel-btn" onclick="processLogin()">접속하기</button>
            </div>
            <div id="formS" style="display: none;">
                <input type="text" id="regId" class="pixel-input" placeholder="생성할 아이디">
                <input type="password" class="pixel-input" placeholder="비밀번호">
                <button class="pixel-btn blue" onclick="processSignup()">생존자 가입</button>
            </div>
        </div>
    </div>

    <!-- 2. 대기실 -->
    <div id="lobbyView" class="view">
        <div class="pixel-panel" style="max-width: 500px;">
            <h2 class="pixel-title" style="font-size: 26px;">생존 구역 (로비)</h2>
            <div style="text-align: left; margin-bottom: 5px; color:#aaa;">요원 선택</div>
            <div class="char-grid">
                <div class="char-box selected" onclick="selectChar(0)"><canvas id="cp0" class="char-preview"></canvas></div>
                <div class="char-box" onclick="selectChar(1)"><canvas id="cp1" class="char-preview"></canvas></div>
                <div class="char-box" onclick="selectChar(2)"><canvas id="cp2" class="char-preview"></canvas></div>
                <div class="char-box" onclick="selectChar(3)"><canvas id="cp3" class="char-preview"></canvas></div>
            </div>

            <div style="display: flex; gap: 10px;">
                <select id="userType" class="pixel-select" onchange="document.getElementById('gradeSelect').style.display = this.value==='student'?'inline-block':'none'">
                    <option value="general">일반 생존 모드</option>
                    <option value="student">학생 교육 모드 (재해 퀴즈)</option>
                </select>
                <select id="gradeSelect" class="pixel-select" style="display:none; width: 140px;">
                    <option>초등 1학년</option><option>초등 2학년</option><option>초등 3학년</option><option>초등 4학년</option><option>초등 5학년</option><option selected>초등 6학년</option>
                </select>
            </div>

            <hr style="border: 2px solid #444; margin: 15px 0;">
            <button class="pixel-btn green" onclick="triggerStart('host')">방 만들기 (호스트)</button>
            <div style="display: flex; gap: 10px; margin-top: 5px;">
                <input type="text" id="joinCode" class="pixel-input" style="margin: 0; text-transform: uppercase;" placeholder="코드(3자리)" maxlength="3">
                <button class="pixel-btn blue" style="margin: 0; width: 120px;" onclick="triggerStart('join')">참가</button>
            </div>
        </div>
    </div>

    <!-- 3. 로딩 및 경고 화면 -->
    <div id="loadingView" class="view">
        <div class="glitch">SYSTEM WARNING</div>
        <p style="font-size: 18px; line-height: 1.6;">극도로 위험한 지역으로 이동 중입니다.<br>고지대(암벽 위)를 활용하여 생존하십시오.</p>
        <div class="progress-bar"><div id="progressFill"></div></div>
        <p id="loadingTip" style="color: #facc15; margin-top: 10px;"></p>
    </div>

    <!-- 4. 인게임 -->
    <canvas id="gameCanvas"></canvas>
    <div id="hud">
        <div style="pointer-events: auto;">
            <div class="info-box">
                <span style="color:#facc15;">⏱️ 생존: <span id="timeVal">0</span>초</span> | 
                <span style="color:#0ea5e9;">📡 코드: <span id="hudCode"></span></span>
            </div>
            <div class="hp-frame"><div id="hpBar"></div><div class="hp-text" id="hpText">100 / 100</div></div>
        </div>
        <div>
            <button class="pixel-btn dark" style="padding: 10px; font-size: 14px;" onclick="alert('학생 퀴즈 및 상점은 인게임 연동 대기중입니다.')">메뉴</button>
        </div>
    </div>
    
    <div id="sysLog"></div>
    <div id="disasterAlert" class="disaster-alert"></div>
    <div id="joyZone"><div id="joyBase"><div id="joyStick"></div></div></div>

<script>
    /* =========================================================================
       [ 1. 50가지 재해 데이터베이스 & 픽셀 엔진 (32x32 맵, 고지대 구현) ]
       ========================================================================= */
    const Pal = { '0': null, '1': '#000000', '2': '#fcd34d', '3': '#b91c1c', '4': '#0ea5e9', '5': '#22c55e', '6': '#8b5cf6', '7': '#ffffff', '8': '#9ca3af', '9': '#374151', 'a': '#7f1d1d', 'b': '#475569', 'c': '#06b6d4', 'd': '#d97706', 'e': '#ea580c', 'f': '#fbbf24', 'g': '#166534', 'h': '#65a30d' };

    // 캐릭터 (4종) + 몬스터 
    const SpriteData = {
        agent0: ["0000011111100000","0000133333310000","0001333333331000","0001122222211000","0012211221122100","0012222222222100","0012122222212100","0001111111111000","0000133333310000","0001331331331000","0001713333171000","0001713333171000","0000111111110000","0000111001110000","0001111001111000","0001111001111000"],
        agent1: ["0000011111100000","0000144444410000","0001444444441000","0001122222211000","0012211221122100","0012222222222100","0012122222212100","0001111111111000","0000144444410000","0001441441441000","0001714444171000","0001714444171000","0000111111110000","0000111001110000","0001111001111000","0001111001111000"],
        agent2: ["0000011111100000","0000155555510000","0001555555551000","0001122222211000","0012211221122100","0012222222222100","0012122222212100","0001111111111000","0000155555510000","0001551551551000","0001715555171000","0001715555171000","0000111111110000","0000111001110000","0001111001111000","0001111001111000"],
        agent3: ["0000011111100000","0000166666610000","0001666666661000","0001122222211000","0012211221122100","0012222222222100","0012122222212100","0001111111111000","0000166666610000","0001661661661000","0001716666171000","0001716666171000","0000111111110000","0000111001110000","0001111001111000","0001111001111000"],
        zombie: ["0000011111100000","0000155555510000","0001555555551000","0001155555511000","0015511551155100","0155555555555510","0155555115555510","0111111111111110","15511b8888b11551","1551b888888b1551","1111b888888b1111","0001b888888b1000","0000111111110000","0000111001110000","0001111001111000","0001111001111000"]
    };

    const Tiles = {
        grass: ["hghghghghghghghg","gghghghghghghghg","hghghghghghghghg","gghghghghghghghg","hghghghghghghghg","gghghghghghghghg","hghghghghghghghg","gghghghghghghghg","hghghghghghghghg","gghghghghghghghg","hghghghghghghghg","gghghghghghghghg","hghghghghghghghg","gghghghghghghghg","hghghghghghghghg","gghghghghghghghg"],
        cliffW:["1111111111111111","1999999119999991","1999999119999991","1111111111111111","1991199999911991","1991199999911991","1111111111111111","1999999119999991","1999999119999991","1111111111111111","1991199999911991","1991199999911991","1111111111111111","1999999119999991","1999999119999991","1111111111111111"],
        cliffT:["8888888888888888","8888888888888888","888b88888888b888","888b88888888b888","8888888888888888","8888888888888888","8888888888888888","8888888888888888","8888888888888888","8888888888888888","888b88888888b888","888b88888888b888","8888888888888888","8888888888888888","8888888888888888","8888888888888888"],
        ladder:["1111000000001111","1dd1000000001dd1","1dd1111111111dd1","1dd1dddddddd1dd1","1dd1111111111dd1","1dd1000000001dd1","1dd1000000001dd1","1dd1111111111dd1","1dd1dddddddd1dd1","1dd1111111111dd1","1dd1000000001dd1","1dd1000000001dd1","1dd1111111111dd1","1dd1dddddddd1dd1","1dd1111111111dd1","1111000000001111"]
    };

    // 50가지 자연재해 및 초자연재해 명단 (분류: F=추락, S=휩쓸기, E=엔티티추적, W=날씨장판)
    const DISASTERS_50 = [
        { n:"운석 추락", t:"F", c:"#ea580c" }, { n:"쓰나미", t:"S", c:"#0284c7" }, { n:"좀비 무리", t:"E" }, { n:"모래 폭풍", t:"W", c:"rgba(217,119,6,0.5)" }, { n:"산성비", t:"W", c:"rgba(132,204,22,0.4)" },
        { n:"눈사태", t:"S", c:"#ffffff" }, { n:"용암 해일", t:"S", c:"#dc2626" }, { n:"거대 우박", t:"F", c:"#e0f2fe" }, { n:"독성 포자", t:"F", c:"#65a30d" }, { n:"블리자드", t:"W", c:"rgba(255,255,255,0.6)" },
        { n:"외계인 빔", t:"F", c:"#a855f7" }, { n:"돌연변이 늑대", t:"E" }, { n:"유독 가스", t:"W", c:"rgba(168,85,247,0.4)" }, { n:"토사구폐", t:"S", c:"#78350f" }, { n:"방사능 유출", t:"W", c:"rgba(250,204,21,0.4)" },
        { n:"플라즈마 구체", t:"F", c:"#38bdf8" }, { n:"기계톱 롤러", t:"S", c:"#475569" }, { n:"뱀파이어 떼", t:"E" }, { n:"우주 쓰레기", t:"F", c:"#94a3b8" }, { n:"폭염", t:"W", c:"rgba(239,68,68,0.3)" },
        { n:"그림자 해일", t:"S", c:"#111827" }, { n:"거미 떼 습격", t:"E" }, { n:"독성 진흙", t:"S", c:"#4d7c0f" }, { n:"얼음 파편", t:"F", c:"#bae6fd" }, { n:"핏빛 파도", t:"S", c:"#991b1b" },
        { n:"슬라임 군단", t:"E" }, { n:"번개 폭풍", t:"W", c:"rgba(255,255,255,0.2)" }, { n:"산성 폭탄", t:"F", c:"#a3e635" }, { n:"해골 병사", t:"E" }, { n:"짙은 안개", t:"W", c:"rgba(156,163,175,0.8)" },
        { n:"초강력 태풍", t:"W", c:"rgba(14,165,233,0.3)" }, { n:"미치광이 삐에로", t:"E" }, { n:"용암탄", t:"F", c:"#f59e0b" }, { n:"블랙홀 파동", t:"S", c:"#000000" }, { n:"자기장 붕괴", t:"W", c:"rgba(139,92,246,0.3)" },
        { n:"강철 창날", t:"F", c:"#cbd5e1" }, { n:"거대 사마귀", t:"E" }, { n:"유령 떼", t:"E" }, { n:"붉은 비", t:"W", c:"rgba(185,28,28,0.5)" }, { n:"플라즈마 해일", t:"S", c:"#818cf8" },
        { n:"킬러 로봇", t:"E" }, { n:"독 화살비", t:"F", c:"#15803d" }, { n:"거대 슬라임 추락", t:"F", c:"#4ade80" }, { n:"레이저 폭격", t:"F", c:"#ef4444" }, { n:"중력 이상", t:"W", c:"rgba(255,255,255,0.1)" },
        { n:"돌연변이 곰", t:"E" }, { n:"가시 해일", t:"S", c:"#3f3f46" }, { n:"불기둥 추락", t:"F", c:"#f97316" }, { n:"벌 떼 습격", t:"E" }, { n:"종말의 빛", t:"W", c:"rgba(255,255,255,0.9)" }
    ];

    const Sprites = { c:[], e:{} };
    function mkSpr(d) {
        let c = document.createElement('canvas'); c.width=16; c.height=16; let cx = c.getContext('2d');
        for(let y=0; y<16; y++) for(let x=0; x<16; x++) if(Pal[d[y][x]]) { cx.fillStyle=Pal[d[y][x]]; cx.fillRect(x,y,1,1); }
        return c;
    }

    const T_SIZE = 64; 
    const COLS = 32, ROWS = 32; // 32x32 타일 맵 (2048 x 2048)
    let mapGrid = [], mapH = []; // 지형 종류 및 Z축 높이 정보

    function generateMap() {
        const mc = document.createElement('canvas'); mc.width = COLS*T_SIZE; mc.height = ROWS*T_SIZE;
        const cx = mc.getContext('2d'); cx.imageSmoothingEnabled = false;
        
        let tG = mkSpr(Tiles.grass), tW = mkSpr(Tiles.cliffW), tT = mkSpr(Tiles.cliffT), tL = mkSpr(Tiles.ladder);
        
        mapGrid = Array(ROWS).fill().map(()=>Array(COLS).fill('G'));
        mapH = Array(ROWS).fill().map(()=>Array(COLS).fill(0)); // 0: 평지, 1: 절벽벽, 2: 암벽위(고지대)

        // 절벽(고지대) 4곳 생성
        const cliffs = [ {x:5,y:5,w:6,h:6}, {x:21,y:5,w:6,h:6}, {x:5,y:21,w:6,h:6}, {x:21,y:21,w:6,h:6} ];
        cliffs.forEach(cf => {
            for(let y=cf.y; y<cf.y+cf.h; y++) {
                for(let x=cf.x; x<cf.x+cf.w; x++) {
                    let isEdge = (x===cf.x || x===cf.x+cf.w-1 || y===cf.y || y===cf.y+cf.h-1);
                    if(isEdge) { mapGrid[y][x] = 'W'; mapH[y][x] = 1; } // 벽
                    else { mapGrid[y][x] = 'T'; mapH[y][x] = 2; } // 옥상
                }
            }
            // 사다리 배치 (남쪽 벽 중앙)
            mapGrid[cf.y+cf.h-1][cf.x+3] = 'L'; mapH[cf.y+cf.h-1][cf.x+3] = 1.5; // 사다리 통과가능
        });

        for(let y=0; y<ROWS; y++) {
            for(let x=0; x<COLS; x++) {
                if(mapGrid[y][x] === 'G') cx.drawImage(tG, x*T_SIZE, y*T_SIZE, T_SIZE, T_SIZE);
                else if(mapGrid[y][x] === 'W') cx.drawImage(tW, x*T_SIZE, y*T_SIZE, T_SIZE, T_SIZE);
                else if(mapGrid[y][x] === 'T') cx.drawImage(tT, x*T_SIZE, y*T_SIZE, T_SIZE, T_SIZE);
                else if(mapGrid[y][x] === 'L') {
                    cx.drawImage(tW, x*T_SIZE, y*T_SIZE, T_SIZE, T_SIZE); // 배경 벽
                    cx.drawImage(tL, x*T_SIZE, y*T_SIZE, T_SIZE, T_SIZE); // 위에 사다리
                }
            }
        }
        Sprites.map = mc;
    }

    function initAssets() {
        for(let i=0; i<4; i++) { Sprites.c[i] = mkSpr(SpriteData['agent'+i]); let x=document.getElementById('cp'+i).getContext('2d'); x.imageSmoothingEnabled=false; x.drawImage(Sprites.c[i],0,0,48,48); }
        Sprites.e.zombie = mkSpr(SpriteData.zombie);
        generateMap();
    }

    /* =========================================================================
       [ 2. 로그인 & 로딩 흐름 관리 ]
       ========================================================================= */
    let myId = '';
    function switchTab(t) { document.getElementById('tabL').className='tab'+(t==='L'?' active':''); document.getElementById('tabS').className='tab'+(t==='S'?' active':''); document.getElementById('formL').style.display=t==='L'?'block':'none'; document.getElementById('formS').style.display=t==='S'?'block':'none'; }
    function processSignup() { let i=document.getElementById('regId').value.trim(); if(!i) return; alert('가입 완료'); switchTab('L'); document.getElementById('loginId').value=i; }
    function processLogin() { myId = document.getElementById('loginId').value.trim(); if(!myId) return; document.querySelectorAll('.view').forEach(e=>e.classList.remove('active')); document.getElementById('lobbyView').classList.add('active'); }
    function selectChar(i) { player.char = i; document.querySelectorAll('.char-box').forEach((e, idx) => e.className = 'char-box'+(idx===i?' selected':'')); }

    function logMsg(text) {
        let box = document.getElementById('sysLog');
        let div = document.createElement('div'); div.className = 'log-msg'; div.innerText = text;
        box.appendChild(div); setTimeout(() => { div.style.opacity=0; setTimeout(()=>div.remove(), 300); }, 4000);
    }

    // 게임 시작 시 로딩 화면 전환
    function triggerStart(type) {
        if(type === 'join' && !document.getElementById('joinCode').value) return alert('코드를 입력하세요.');
        document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
        document.getElementById('loadingView').classList.add('active');
        
        let tips = ["사다리 타일로 접근하면 고지대로 올라갈 수 있습니다.", "쓰나미는 고지대에 있으면 피해를 받지 않습니다.", "동료가 유령이 되면 가까이 가서 화면을 터치해 부활시키세요."];
        document.getElementById('loadingTip').innerText = "TIP: " + tips[Math.floor(Math.random()*tips.length)];
        
        document.getElementById('progressFill').style.width = '0%';
        setTimeout(() => document.getElementById('progressFill').style.width = '100%', 100);
        
        setTimeout(() => {
            if(type === 'host') createRoom();
            else joinRoom();
        }, 3000);
    }

    /* =========================================================================
       [ 3. 네트워크 및 호스트 엔진 (50가지 재해 생성) ]
       ========================================================================= */
    const player = { x: 1024, y: 1024, z: 0, w: 40, h: 40, speed: 7, hp: 100, state: 'alive', char: 0, revive: 0, id: '' };
    const camera = { x: 1024, y: 1024, zoom: 1.1 };
    
    let GameState = { players: {}, disasters: [], zombies: [], weather: null, time: 0, alert: '' };
    let peer = null, connections = [], roomCode = '', isHost = false;
    let keys = {x:0, y:0};
    const cvs = document.getElementById('gameCanvas'); const ctx = cvs.getContext('2d');
    let W, H;
    
    function resize() { W = cvs.width = window.innerWidth; H = cvs.height = window.innerHeight; ctx.imageSmoothingEnabled = false; }
    window.addEventListener('resize', resize); resize();

    function initPeer(id, cb) {
        peer = new Peer("ds50_" + id);
        peer.on('open', cb);
        peer.on('connection', c => {
            if(!connections.includes(c)) connections.push(c);
            c.on('data', d => {
                if(isHost) {
                    if(d.type === 'join') {
                        GameState.players[c.peer] = { x: 1024, y: 1024, z:0, c: d.char, n: d.name, s: 'alive', hp: 100 };
                        logMsg(`[알림] ${d.name} 생존자 합류.`);
                        connections.forEach(conn => { if(conn.open) conn.send({type:'msg', text:`[알림] ${d.name} 합류.`}); });
                    } else if(d.type === 'input' && GameState.players[c.peer]) {
                        GameState.players[c.peer].x = d.x; GameState.players[c.peer].y = d.y;
                        GameState.players[c.peer].z = d.z; GameState.players[c.peer].s = d.s; GameState.players[c.peer].hp = d.hp;
                    }
                } else {
                    if(d.type === 'sync') GameState = d.state;
                    else if(d.type === 'msg') logMsg(d.text);
                    else if(d.type === 'start') startGameCore();
                }
            });
        });
    }

    function createRoom() {
        roomCode = Math.random().toString(36).substring(2,5).toUpperCase(); isHost = true;
        initPeer(roomCode, () => { startGameCore(); });
    }
    
    function joinRoom() {
        roomCode = document.getElementById('joinCode').value.toUpperCase();
        initPeer("u_"+Math.random().toString(36).substring(2,6), () => {
            let c = peer.connect("ds50_" + roomCode);
            c.on('open', () => { connections.push(c); c.send({type: 'join', name: myId, char: player.char}); startGameCore(); });
        });
    }

    function startGameCore() {
        document.querySelectorAll('.view').forEach(e=>e.classList.remove('active'));
        document.getElementById('hud').style.display = 'flex';
        document.getElementById('joyZone').style.display = 'block';
        document.getElementById('hudCode').innerText = roomCode;
        player.id = peer.id;
        
        if(isHost) {
            GameState.players[player.id] = { x: player.x, y: player.y, z: player.z, c: player.char, n: myId, s: 'alive', hp: 100 };
            connections.forEach(c => { if(c.open) c.send({type: 'start'}); });
            setInterval(hostLoop, 1000/30);
            setInterval(hostDisasterGen, 1500); // 1.5초마다 이벤트
        }
        logMsg(`[시스템] 생존 게임 시작.`);
        requestAnimationFrame(renderLoop);
    }

    /* === 호스트 재해 엔진 === */
    let weaTimer = 0;
    function hostDisasterGen() {
        GameState.time++;
        // 50가지 중 랜덤 뽑기
        let ev = DISASTERS_50[Math.floor(Math.random() * 50)];
        
        if(ev.t === 'F') { // 추락
            GameState.disasters.push({ n: ev.n, c: ev.c, t: 'F', x: player.x + (Math.random()-0.5)*1200, y: player.y - 800, vy: 8+Math.random()*6, sz: 80 });
            if(Math.random()<0.3) GameState.alert = `주의: ${ev.n} 접근 중!`;
        } 
        else if(ev.t === 'S') { // 휩쓸기 (쓰나미 류)
            if(!GameState.disasters.find(d=>d.t==='S')) { // 한 번에 하나만
                GameState.disasters.push({ n: ev.n, c: ev.c, t: 'S', y: -800, vy: 5 });
                GameState.alert = `경고: 거대한 ${ev.n}! 고지대로 대피하십시오!`;
            }
        }
        else if(ev.t === 'W') { // 날씨/장판
            if(weaTimer <= 0) { GameState.weather = ev; weaTimer = 10; GameState.alert = `기상 악화: ${ev.n} 발생`; }
        }
        else if(ev.t === 'E') { // 엔티티 (좀비 등)
            if(GameState.zombies.length < 15) {
                GameState.zombies.push({ x: Math.random()*(COLS*T_SIZE), y: Math.random()*(ROWS*T_SIZE), speed: 3.5 });
            }
        }
        
        if(weaTimer > 0) weaTimer--; else GameState.weather = null;
        if(Math.random() < 0.2) GameState.alert = ''; // 알림 초기화
    }

    function hostLoop() {
        GameState.players[player.id].x = player.x; GameState.players[player.id].y = player.y; GameState.players[player.id].z = player.z;
        GameState.players[player.id].s = player.state; GameState.players[player.id].hp = player.hp;

        // 물리 업데이트
        for(let i=GameState.disasters.length-1; i>=0; i--) {
            let d = GameState.disasters[i]; d.y += d.vy;
            if(d.t === 'F' && d.y > player.y + 1000) GameState.disasters.splice(i,1);
            if(d.t === 'S' && d.y > (ROWS*T_SIZE)+800) GameState.disasters.splice(i,1);
        }
        GameState.zombies.forEach(z => {
            let target = null, minDist = 9999;
            Object.values(GameState.players).forEach(p => {
                if(p.s === 'alive') { let d = Math.hypot(p.x - z.x, p.y - z.y); if(d < minDist) { minDist = d; target = p; } }
            });
            if(target) { z.x += ((target.x-z.x)/minDist)*z.speed; z.y += ((target.y-z.y)/minDist)*z.speed; }
        });

        connections.forEach(c => { if(c.open) c.send({type: 'sync', state: GameState}); });
    }

    /* =========================================================================
       [ 4. 클라이언트 물리(고도 처리) 및 렌더링 ]
       ========================================================================= */
    const joyZone = document.getElementById('joyZone'), joyStick = document.getElementById('joyStick'), joyBase = document.getElementById('joyBase');
    let jAct = false, jOri = {x:0, y:0}, maxJ = 40;
    joyZone.addEventListener('touchstart', e => { jAct=true; let r=joyBase.getBoundingClientRect(); jOri={x:r.left+r.width/2, y:r.top+r.height/2}; updateJ(e.touches[0]); });
    joyZone.addEventListener('touchmove', e => { if(jAct){ e.preventDefault(); updateJ(e.touches[0]); } });
    joyZone.addEventListener('touchend', () => { jAct=false; joyStick.style.transform=`translate(0,0)`; keys.x=0; keys.y=0; });
    function updateJ(t) { let dx=t.clientX-jOri.x, dy=t.clientY-jOri.y, d=Math.hypot(dx,dy); if(d>maxJ){dx=(dx/d)*maxJ; dy=(dy/d)*maxJ;} joyStick.style.transform=`translate(${dx}px,${dy}px)`; keys.x=dx/maxJ; keys.y=dy/maxJ; }
    window.addEventListener('keydown', e => { if(['w','ArrowUp'].includes(e.key))keys.y=-1; if(['s','ArrowDown'].includes(e.key))keys.y=1; if(['a','ArrowLeft'].includes(e.key))keys.x=-1; if(['d','ArrowRight'].includes(e.key))keys.x=1; });
    window.addEventListener('keyup', e => { if(['w','s','ArrowUp','ArrowDown'].includes(e.key))keys.y=0; if(['a','d','ArrowLeft','ArrowRight'].includes(e.key))keys.x=0; });

    cvs.addEventListener('pointerdown', e => {
        if(player.state === 'ghost') return;
        const wx = (e.clientX - W/2) / camera.zoom + camera.x, wy = (e.clientY - H/2) / camera.zoom + camera.y;
        Object.keys(GameState.players).forEach(id => {
            let p = GameState.players[id];
            if(p.s === 'ghost' && Math.hypot(p.x - wx, p.y - (wy+p.z)) < 80 && !isHost) { // Z 보정
                let c = connections.find(c => c.peer === id); if(c && c.open) c.send({type: 'revive'});
            }
        });
    });

    let frameCount = 0;

    function renderLoop() {
        frameCount++;
        let pState = isHost ? GameState : GameState;
        let spd = player.state === 'ghost' ? player.speed * 0.5 : player.speed;
        
        // --- 1. Z축(고도) 물리 엔진 ---
        let nextX = player.x + (keys.x * spd);
        let nextY = player.y + (keys.y * spd);
        let cTX = Math.floor(player.x / T_SIZE), cTY = Math.floor(player.y / T_SIZE);
        let nTX = Math.floor(nextX / T_SIZE), nTY = Math.floor(nextY / T_SIZE);
        
        // 맵 범위 제한
        nTX = Math.max(0, Math.min(nTX, COLS-1)); nTY = Math.max(0, Math.min(nTY, ROWS-1));

        let currentH = mapH[cTY][cTX]; // 0:평지, 1:벽, 1.5:사다리, 2:고지대
        let nextH = mapH[nTY][nTX];
        
        // 이동 가능 조건: 높이 차이가 1 미만이거나(사다리 이용), 유령이거나
        if(player.state === 'ghost' || Math.abs(currentH - nextH) < 1) {
            player.x = nextX; player.y = nextY;
            // Z축 렌더링 값 목표치 설정 (고지대면 60픽셀 상승)
            let targetZ = (nextH === 2) ? 60 : (nextH === 1.5 ? 30 : 0);
            player.z += (targetZ - player.z) * 0.2; // 부드러운 승강
        }

        camera.x += (player.x - camera.x) * 0.1; camera.y += (player.y - camera.y) * 0.1;

        // --- 2. 데미지 판정 (고지대 면역 처리) ---
        if(player.state === 'alive') {
            pState.disasters.forEach(d => {
                if(d.t === 'F' && Math.hypot(player.x - d.x, player.y - d.y) < d.sz*0.4) { player.hp -= 20; d.y += 2000; }
                if(d.t === 'S') {
                    // 휩쓸기는 Z고도 40 미만(평지)에만 피해를 줌!
                    if(player.y > d.y && player.y < d.y + 400 && player.z < 40) player.hp -= 3;
                }
            });
            pState.zombies.forEach(z => { if(Math.hypot(player.x - z.x, player.y - z.y) < 30 && player.z < 20) player.hp -= 2; });
            if(pState.weather) player.hp -= 0.1; // 날씨 지속 피해
            
            if(player.hp <= 0) { player.hp = 0; player.state = 'ghost'; player.z = 0; }
        }
        
        // 알림 UI
        let alertBox = document.getElementById('disasterAlert');
        if(pState.alert) { alertBox.style.display = 'block'; alertBox.innerText = pState.alert; } else { alertBox.style.display = 'none'; }
        document.getElementById('timeVal').innerText = pState.time || 0;

        if(!isHost && connections[0] && connections[0].open) connections[0].send({type:'input', x:player.x, y:player.y, z:player.z, s:player.state, hp:player.hp});

        const hpBar = document.getElementById('hpBar'), hpTxt = document.getElementById('hpText');
        hpBar.style.width = Math.max(0, player.hp) + '%';
        if(player.state === 'ghost') { hpBar.style.background = 'transparent'; hpTxt.innerText = `유령 (부활대기)`; hpTxt.style.color = '#0ea5e9'; } 
        else { hpBar.style.background = player.hp < 30 ? '#b91c1c' : '#16a34a'; hpTxt.innerText = `${Math.floor(player.hp)} / 100`; hpTxt.style.color = '#fff'; }

        // --- 3. 렌더링 ---
        ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
        ctx.save(); ctx.translate(W/2, H/2); ctx.scale(camera.zoom, camera.zoom); ctx.translate(-camera.x, -camera.y);

        if(Sprites.map) ctx.drawImage(Sprites.map, 0, 0);

        pState.zombies.forEach(z => {
            let bounce = Math.sin(frameCount/5)*3;
            ctx.drawImage(Sprites.e.zombie, z.x-20, z.y-40+bounce, 40, 40);
        });

        // 플레이어들 (Z축을 Y렌더링에 빼서 공중에 뜬 것처럼 표현)
        Object.keys(pState.players).forEach(id => {
            let p = pState.players[id];
            if(id === player.id && !isHost) { p.x = player.x; p.y = player.y; p.z = player.z; p.s = player.state; } 
            
            // 그림자
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.beginPath(); ctx.ellipse(p.x, p.y, 15, 8, 0, 0, Math.PI*2); ctx.fill();
            
            drawPxl(p.x, p.y - p.z, p.c, p.s, p.n, (id===player.id), frameCount);
        });

        pState.disasters.forEach(d => {
            if(d.t === 'F') {
                ctx.fillStyle = d.c; ctx.beginPath(); ctx.arc(d.x, d.y, d.sz/2, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(d.x-d.sz/4, d.y-d.sz/4, d.sz/6, 0, Math.PI*2); ctx.fill();
            }
            else if(d.t === 'S') {
                ctx.fillStyle = d.c;
                ctx.fillRect(0, d.y, COLS*T_SIZE, 400);
                ctx.fillStyle = 'rgba(255,255,255,0.4)';
                for(let w=0; w<COLS*T_SIZE; w+=80) ctx.fillRect(w + Math.sin(frameCount/10)*20, d.y + 10, 40, 15);
            }
        });
        ctx.restore();

        if(pState.weather) {
            ctx.fillStyle = pState.weather.c; ctx.fillRect(0, 0, W, H);
        }

        requestAnimationFrame(renderLoop);
    }

    function drawPxl(x, y, cIdx, state, name, isMe, time) {
        ctx.save(); if(state === 'ghost') ctx.globalAlpha = 0.4;
        let bounce = (isMe && (keys.x !== 0 || keys.y !== 0)) ? Math.sin(time/5)*4 : 0;
        
        if(Sprites.c[cIdx]) ctx.drawImage(Sprites.c[cIdx], x - player.w/2, y - player.h + bounce, player.w, player.h);

        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(x - 30, y - player.h - 22 + bounce, 60, 16);
        ctx.fillStyle = isMe ? '#facc15' : '#fff';
        ctx.font = '10px Galmuri11'; ctx.textAlign = 'center';
        ctx.fillText(name || '생존자', x, y - 10 - player.h + bounce);
        ctx.restore();
    }

    initAssets();
</script>
</body>
